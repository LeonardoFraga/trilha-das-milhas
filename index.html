<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Trilha de estudos gratuita sobre milhas e pontos, do básico ao avançado: vídeos gratuitos em português auditados, glossário, calculadoras e progresso salvo no navegador.">
<meta name="theme-color" content="#0C1120">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Milhas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<title>Trilha das Milhas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Layout: vidro fosco sobre o fundo azul-noite. Uma coluna de celular, quatro telas e a navegação fixa embaixo. */
:root{
  color-scheme:dark;
  --bg:#0C1120;
  --text:#fff;
  --muted:rgba(255,255,255,.78);
  --accent:#9FBFFF;
  --chip-link:#BCD2FF;
  --prog:#7AA7FF;          /* a rota percorrida */
  --ok:#7CE0B0;--warn:#FFD27A;--bad:#FF9A8A;
  --g06:rgba(255,255,255,.06);--g07:rgba(255,255,255,.07);--g08:rgba(255,255,255,.08);--g10:rgba(255,255,255,.1);
  --b12:rgba(255,255,255,.12);--b14:rgba(255,255,255,.14);--b18:rgba(255,255,255,.18);--b22:rgba(255,255,255,.22);
  --a18:rgba(122,167,255,.18);--a25:rgba(122,167,255,.25);--a32:rgba(122,167,255,.32);
  --on:rgba(96,150,255,.5);--on-line:rgba(170,200,255,.7);
  --solid:rgba(22,30,52,.92);  /* vidro sem transparência */
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font:400 14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit}
img{max-width:100%}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid #9FBFFF;outline-offset:2px}

/* ---------- fundo ---------- */
.blobs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blobs div{position:relative;max-width:480px;height:100%;margin:0 auto}
.blobs i{position:absolute;border-radius:50%}
.blobs i:first-child{width:320px;height:320px;top:-60px;left:-80px;background:#2F5BFF;filter:blur(80px);opacity:.55}
.blobs i:last-child{width:260px;height:260px;top:440px;right:-90px;background:#8B5CF6;filter:blur(90px);opacity:.4}

.app{position:relative;z-index:1;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding:max(28px,calc(env(safe-area-inset-top,0px) + 14px)) 18px calc(116px + env(safe-area-inset-bottom,0px))}
.app > *{flex:none;min-width:0}

/* ---------- componentes ---------- */
.card{padding:20px;border-radius:24px;background:var(--g10);border:1px solid var(--b22);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);display:flex;flex-direction:column;gap:12px}
.card2{border-radius:20px;background:var(--g07);border:1px solid var(--b14);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.pad16{padding:16px}.pad18{padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.btn-primary{min-height:52px;padding:0 18px;border-radius:16px;border:0;background:#fff;color:#0C1120;font:800 15px/1.2 var(--f);display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;cursor:pointer;text-align:center}
.pill{min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--b18);background:var(--g06);color:rgba(255,255,255,.88);font:700 13px/1.2 var(--f);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--on);border-color:var(--on-line);color:#fff}
.stepper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stepper .pill{min-height:46px;padding:0 6px}
.stepper .pill b{font-weight:800}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.muted{color:var(--muted)}
.kicker{font:700 12px/1.3 var(--f);text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.meta{font-size:13px;color:var(--muted)}
.h13{font:700 13px/1.3 var(--f)}
.num{font:800 22px/1 var(--f);font-variant-numeric:tabular-nums}
.link{font:700 13px/1.3 var(--f);color:var(--accent);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;background:none;border:0;padding:0;cursor:pointer}
.now{font-size:14px;line-height:1.45;color:var(--muted)}
.now b{color:#fff}
.title{font:800 30px/1.1 var(--f);letter-spacing:-.01em}
.intro{font-size:14px;line-height:1.45;color:var(--muted);margin-top:6px}
.tname{font:800 28px/1.1 var(--f);text-wrap:balance}

/* ---------- topo do início ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font:800 18px/1.2 var(--f);margin:0}
.brand b{color:var(--prog)}
.saved{font-size:12px;color:var(--muted);text-align:right}

/* ---------- rota (progresso) ---------- */
.route{position:relative;height:58px;--p:0}
.route .track{position:absolute;left:12px;right:12px;top:16px;border-top:2px dashed rgba(255,255,255,.28)}
.route .fill{position:absolute;left:12px;top:15px;height:4px;border-radius:4px;background:var(--prog);width:calc((100% - 24px) * var(--p));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.route .plane{position:absolute;top:17px;left:calc(12px + (100% - 24px) * var(--p));width:26px;height:26px;margin:-13px 0 0 -13px;display:grid;place-items:center;border-radius:50%;background:#fff;transition:left .8s cubic-bezier(.2,.8,.2,1)}
.route .plane svg{width:15px;height:15px;fill:#0C1120}
.route .stop{position:absolute;top:17px;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--bg);border:2px solid rgba(255,255,255,.4)}
.route .stop.on{background:var(--prog);border-color:var(--prog)}
.route .lbl{position:absolute;top:32px;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.route .lbl.on{color:#fff;font-weight:700}
.cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cell{border-radius:14px;background:var(--g06);border:1px solid var(--b12);padding:10px;display:flex;flex-direction:column;gap:4px}
.cell span{font-size:12px;color:var(--muted);line-height:1.3}
.minitrail{display:grid;grid-template-columns:repeat(var(--n,8),minmax(0,1fr));gap:6px}
.minitrail a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none}
.minitrail .cell{position:relative;width:100%;height:40px;padding:0;overflow:hidden}
.minitrail .cell i{position:absolute;inset:auto 0 0 0;background:var(--prog)}
.minitrail small{font-size:12px;color:var(--muted)}
.minitrail a[aria-current="step"] small{color:#fff;font-weight:700}

/* ---------- trilha ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.stages{display:flex;flex-direction:column;gap:10px}
.stage{overflow:hidden}
.stage.cur{background:var(--a18)}
.stage-h{width:100%;display:grid;grid-template-columns:30px 1fr 22px;gap:10px;align-items:center;padding:14px;background:none;border:0;text-align:left;cursor:pointer;color:#fff}
.badge{width:30px;height:30px;border-radius:50%;background:var(--a25);display:grid;place-items:center;font:800 13px/1 var(--f)}
.stage-name{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stage-name b{font:700 15px/1.25 var(--f)}
.stage-name small{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lvl{display:block;font:700 11px/1.3 var(--f);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.bar{height:6px;border-radius:6px;background:var(--b12);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--prog);border-radius:6px;transition:width .6s}
.status{display:block;min-height:16px;font:700 12px/1.3 var(--f);color:var(--accent)}
.pm{font:400 20px/1 var(--f);text-align:center}
.stage-intro{padding:0 14px 12px 54px;font-size:13px;line-height:1.45;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.stage-intro b{color:#fff}
.trow{display:flex;align-items:center;gap:10px;min-height:44px;padding:12px 14px 12px 54px;border-top:1px solid var(--g08);text-decoration:none;color:#fff}
.trow > span:first-child{min-width:0;display:flex;flex-direction:column;gap:2px}
.trow b{font:700 14px/1.3 var(--f)}
.trow small{font-size:12px;color:var(--muted)}
.trow .arr{margin-left:auto;flex:none;color:var(--accent);font-weight:700}
.trow.sel{background:var(--a18)}
.trow-label{padding:14px 14px 6px 54px;border-top:1px solid var(--g08);font:700 12px/1.3 var(--f);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.trow-label + .trow{border-top:0}
.empty{padding:12px 14px 14px 54px;border-top:1px solid var(--g08);font-size:13px;color:var(--muted)}

/* ---------- aula ---------- */
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar-top .meta{text-align:right}
.en{font-size:13px;color:var(--muted);margin-top:6px}
.why{font-size:14px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.why.open{display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h h2{font:700 12px/1.3 var(--f);text-transform:uppercase;letter-spacing:.06em}
.sec-h span{font-size:12px;color:var(--muted)}
.videos{display:flex;flex-direction:column;gap:10px}
.vbox{overflow:hidden}
.video{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center;padding:8px;color:#fff}
.video.on{grid-template-columns:1fr}
button.thumb{padding:0;border:0;cursor:pointer}
.video .vt b{cursor:pointer}
.vframe{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vyt{font-weight:700;color:var(--accent);text-decoration:none;padding:6px 2px;margin:-6px -2px;white-space:nowrap}
.thumb{position:relative;width:112px;height:63px;border-radius:12px;overflow:hidden;background:var(--g08)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb .play{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(0,0,0,.65);display:grid;place-items:center}
.thumb .dur{position:absolute;right:4px;bottom:4px;padding:1px 4px;border-radius:4px;background:rgba(0,0,0,.75);font:700 10px/1.3 var(--f)}
.play svg{width:10px;height:12px;fill:#fff;margin-left:2px}
.vt{min-width:0;display:flex;flex-direction:column;gap:4px}
.vt b{font:700 13px/1.3 var(--f);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vt span{font-size:12px;color:var(--muted)}
.vdesc{font-size:13px;line-height:1.45;color:var(--muted);padding:0 12px 12px}
/* parecer do auditor sobre o vídeo */
.audit{margin:0 8px 8px;padding:10px 12px;border-radius:14px;background:var(--g06);border:1px solid var(--b12);display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.45;color:var(--muted)}
.audit-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:700 12px/1.3 var(--f);color:#fff}
.score-b{padding:2px 8px;border-radius:99px;background:var(--a25);font:800 12px/1.4 var(--f);font-variant-numeric:tabular-nums}
.risk{padding:2px 8px;border-radius:99px;font:700 11px/1.4 var(--f);border:1px solid}
.risk.baixo{color:var(--ok);border-color:rgba(124,224,176,.45)}
.risk.medio{color:var(--warn);border-color:rgba(255,210,122,.45)}
.risk.alto{color:var(--bad);border-color:rgba(255,154,138,.45)}
.audit .al b{color:var(--warn)}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--g06);border:1px solid var(--b12)}
.tabs button{min-height:42px;padding:0 4px;border-radius:12px;border:1px solid transparent;background:transparent;color:rgba(255,255,255,.8);font:700 13px/1.2 var(--f);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--a32);border-color:rgba(170,200,255,.5);color:#fff}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.items li{display:grid;grid-template-columns:28px 1fr;gap:12px;font-size:14px;line-height:1.5}
.mk{width:28px;height:28px;border-radius:50%;background:var(--a25);display:grid;place-items:center;font:800 12px/1 var(--f)}
.items li > span:last-child{padding-top:2px}
.foot{font-size:13px;line-height:1.5;color:var(--muted);display:flex;flex-direction:column;gap:12px}
.foot .pill{align-self:flex-start}

/* termos do glossário dentro do texto */
.gl{border-bottom:1.5px dotted var(--accent);cursor:help}

/* ---------- glossário ---------- */
.search,.inp{width:100%;min-height:50px;padding:0 18px;border-radius:16px;border:1px solid var(--b22);background:var(--g08);color:#fff;font:400 15px/1.2 var(--f);-webkit-appearance:none;appearance:none}
.search::placeholder{color:#fff;opacity:.6}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px}
.chips::-webkit-scrollbar{display:none}
.chips .pill{flex:none;min-height:38px}
.terms{display:flex;flex-direction:column;gap:10px}
.culture{display:flex;flex-wrap:wrap;gap:8px}
.culture .pill{min-height:38px;padding:0 12px}
.term{display:flex;flex-direction:column;gap:8px}
.term-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.term-h b{font:800 17px/1.25 var(--f)}
.term-h small{flex:none;font-size:11px;color:var(--muted);text-align:right}
.term p{font-size:14px;line-height:1.5;color:var(--muted)}
.elinks{display:flex;flex-wrap:wrap;gap:6px}
.elink{min-height:32px;padding:0 10px;border-radius:99px;border:1px solid rgba(170,200,255,.35);background:none;color:var(--chip-link);font:700 12px/1.2 var(--f);display:inline-flex;align-items:center;text-decoration:none;cursor:pointer}
.none{text-align:center;color:var(--muted);padding:24px 0}
.note{font-size:14px;line-height:1.5;color:var(--muted)}
.note b{color:#fff}
.ext{font:700 14px/1.3 var(--f);color:var(--accent);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;align-self:flex-start}

/* ---------- calculadoras ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:700 13px/1.3 var(--f)}
.field small{font-size:12px;color:var(--muted)}
.inp{font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.out{border-radius:16px;background:var(--a18);border:1px solid rgba(170,200,255,.35);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.out .big{font:800 28px/1.1 var(--f);font-variant-numeric:tabular-nums}
.out p{font-size:13px;line-height:1.45;color:var(--muted)}
.out p b{color:#fff}
.verdict{font:700 14px/1.4 var(--f)}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}.verdict.mid{color:var(--warn)}
.formula{font-size:12px;line-height:1.5;color:var(--muted)}

/* ---------- guias (regras de ouro, mapa) ---------- */
.pos-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pos-h b{font:800 17px/1.25 var(--f)}
.pos-h span{flex:none;font:800 13px/1 var(--f);color:var(--accent)}
.pos dl{margin:0;display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.5;color:var(--muted)}
.pos dt{font:700 12px/1.3 var(--f);text-transform:uppercase;letter-spacing:.06em;color:#fff;margin-top:6px}
.pos dd{margin:0}
.flow{display:flex;justify-content:center;font:800 18px/1 var(--f);color:var(--accent)}

/* ---------- navegação ---------- */
.tabbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(448px,calc(100% - 32px));display:flex;gap:4px;padding:6px;border-radius:99px;background:var(--g10);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.tabbar a{flex:1;min-width:0;padding:13px 2px;border-radius:99px;border:1px solid transparent;color:rgba(255,255,255,.8);font:700 13px/1.2 var(--f);text-align:center;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabbar a[aria-current="page"]{background:var(--a32);border-color:rgba(170,200,255,.5);color:#fff}

/* ---------- folha do glossário ---------- */
.sheet-back{position:fixed;inset:0;z-index:50;background:rgba(5,8,16,.55)}
.sheet{position:fixed;z-index:51;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(464px,calc(100% - 16px));max-height:70vh;overflow:auto;padding:20px;border-radius:24px;background:rgba(24,33,58,.78);border:1px solid var(--b22);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);display:flex;flex-direction:column;gap:12px}
.sheet .row{align-items:baseline}
.sheet b{font:800 17px/1.25 var(--f)}
.sheet small{font-size:11px;color:var(--muted)}
.sheet p{font-size:14px;line-height:1.5;color:var(--muted)}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- toast ---------- */
.toast{position:fixed;z-index:40;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);width:max-content;max-width:calc(100% - 32px);padding:12px 16px;border-radius:16px;background:var(--solid);border:1px solid var(--b22);color:#fff;font:600 14px/1.4 var(--f);text-align:center;opacity:0;visibility:hidden;pointer-events:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s,visibility 0s .3s}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s,visibility 0s}
.toast b{color:var(--accent)}

/* sem vidro: transparência reduzida ou navegador sem backdrop-filter */
@media (prefers-reduced-transparency:reduce){
  .card,.card2,.tabbar,.sheet{background:var(--solid);-webkit-backdrop-filter:none;backdrop-filter:none}
  .stage.cur{background:rgba(36,52,92,.95)}
}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .card,.card2,.tabbar,.sheet{background:var(--solid)}
  .stage.cur{background:rgba(36,52,92,.95)}
}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><div><i></i><i></i></div></div>
<main class="app" id="app"></main>
<nav class="tabbar" aria-label="Seções">
  <a href="#inicio" data-nav="inicio">Início</a>
  <a href="#trilha" data-nav="trilha">Trilha</a>
  <a href="#glossario" data-nav="glossario">Glossário</a>
  <a href="#calculadora" data-nav="calculadora">Contas</a>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const SITE = {"verificado_em":"novembro de 2026","etapas":[{"modulo":1,"nivel":"Básico","titulo":"Fundamentos","resumo":"Como o sistema de pontos e milhas funciona, quem são os programas e a regra que vem antes de tudo: cartão de crédito só serve para milhas se a fatura for paga inteira, todo mês.","grupos":[{"tipo":"Entender o sistema","aulas":[{"id":"o-que-sao-pontos-e-milhas","nome":"O que são pontos e milhas","porque":"Quase todo erro de iniciante vem de confundir ponto com milha: transferir na hora errada, para o programa errado, ou trocar por produto que vale pouco. Entender que o ponto nasce no banco e só vira milha quando vai para a companhia aérea é a base de tudo o que vem depois na trilha.","passos":["Descubra em qual programa o seu cartão acumula: um programa de banco (ex.: Livelo, Esfera, programa próprio do banco) ou direto numa companhia aérea (cartões co-branded).","Entre no app ou no site do banco e anote quantos pontos você tem hoje e quantos ganha por real ou por dólar gasto, conforme o seu contrato.","Faça cadastro gratuito nos três programas aéreos nacionais (Smiles, LATAM Pass e Azul Fidelidade), mesmo sem transferir nada ainda.","Desenhe o seu ciclo: gasto no cartão → pontos no banco → transferência (de preferência com bônus) → milhas na companhia → emissão da passagem.","Antes de transferir qualquer ponto, espere chegar à etapa 3 (Transferir e fazer a conta): ponto parado no banco ainda pode ir para qualquer programa; milha na companhia não volta."],"armadilhas":["Transferir pontos para uma companhia aérea sem ter uma viagem em vista: a transferência é de mão única e as milhas ficam presas àquele programa.","Trocar pontos por produtos no shopping do banco achando que é a mesma coisa que viajar: o valor por ponto costuma ser bem menor.","Tratar milha como dinheiro: ela não tem liquidez garantida, expira, não tem proteção do FGC e pode perder valor por decisão do programa.","Achar que precisa gastar mais para começar: o ponto de partida é o que você já gasta, com a fatura paga inteira."],"dica":"Para saber quanto vale uma milha num resgate, faça a conta do milheiro: (preço da passagem em dinheiro − taxas pagas no resgate) ÷ milhas usadas × 1.000. Exemplo com números fictícios: passagem de R$ 1.200 ou 20.000 milhas + R$ 60 de taxa → (1.200 − 60) ÷ 20.000 × 1.000 = R$ 57 por milheiro. Os valores de referência mudam o tempo todo; a lógica da conta não muda.","videos":[{"titulo":"Milhas: O Guia Completo para Começar a Acumular!","canal":"Melhores Destinos","url":"https://www.youtube.com/watch?v=HD_QdLN8HDY","publicado":"2025-06-30","duracao":"14:24","auditoria":{"nota":8,"risco":"Baixo","veredito":"Introdução curta e bem estruturada: o que são milhas, os dois tipos de programa (banco e companhia aérea), acúmulo com cartão, clubes e o erro de transferir sem plano. Sem promessa de renda; a monetização é só a divulgação dos apps do próprio canal. Auditado por título, descrição e capítulos (a transcrição não estava acessível).","alerta":"O vídeo fala em clubes e transferências, que são assunto da etapa 3. Por enquanto, só entenda o conceito: não assine clube nem transfira pontos ainda. A lista de programas por banco na descrição é de 2025 e pode ter mudado."}},{"titulo":"MILHAS PARA INICIANTES! - TUDO que você precisa saber para COMEÇAR","canal":"Clube do Valor","url":"https://www.youtube.com/watch?v=ffSKmFvV6cI","publicado":"2026-10-12","duracao":"20:18","auditoria":{"nota":7,"risco":"Médio","veredito":"Atualizado (out/2026) e com a distinção certa: ponto nasce no banco e vira milha na companhia, já com o nome Azul Fidelidade. Traz CPM e uma comparação entre milhas e cashback, o que é raro. Perde pontos pelo apelo de 'executiva pagando só as taxas' e por ser vitrine de um serviço pago de gestão de milhas. Auditado por título e descrição detalhada; a transcrição não estava acessível.","alerta":"O exemplo de compra bonificada (R$ 5.000 a 10 pontos por real = 50.000 pontos) está certo na conta, mas só vale se você já ia comprar aquilo, pelo preço de mercado. Executiva 'só com taxas' exige muitas milhas e disponibilidade rara. Ignore o convite para a gestão paga."}}]},{"id":"programas-do-brasil","nome":"Os principais programas do Brasil","porque":"Concentrar pontos no programa certo vale mais do que acumular muito em vários lugares sem conseguir emitir nada. Cada companhia aérea atende melhor certas regiões e destinos, e cada programa de banco transfere para parceiros diferentes. Escolher bem no começo evita saldo espalhado e perdido.","passos":["Liste os aeroportos de onde você costuma sair e veja quais companhias (GOL, LATAM, Azul) voam de lá com mais frequência.","Associe cada companhia ao seu programa: GOL → Smiles; LATAM → LATAM Pass; Azul → Azul Fidelidade (o antigo TudoAzul, que mudou de nome em 2024).","Confira no site do seu programa de banco (Livelo, Esfera ou programa próprio do banco) para quais companhias ele transfere hoje e com qual paridade.","Escolha um programa aéreo principal, ligado ao seu aeroporto e aos destinos que você quer de verdade, e no máximo um secundário.","Anote a data em que você fez essa análise: parcerias, paridades e regras mudam várias vezes por ano."],"armadilhas":["Escolher o programa pelo 'milheiro mais barato' sem olhar se ele voa para onde você quer ir: milha barata que não emite nada não vale nada.","Espalhar pequenos saldos em cinco programas: nenhum deles chega ao valor de uma passagem antes de expirar.","Seguir vídeos ou blogs antigos que ainda falam em TudoAzul, Multiplus ou Avianca Brasil: as regras citadas provavelmente já mudaram.","Esquecer o risco da companhia: GOL e Azul passaram por recuperação judicial nos EUA (Chapter 11). Isso não apaga milhas automaticamente, mas reforça a regra de não estocar."],"dica":"Não existe 'melhor programa' no vácuo. A pergunta certa é: 'Qual programa me leva, do meu aeroporto, ao destino que eu quero, pelo menor custo total em reais?' Junte pontos no banco (que é flexível) e só escolha a companhia quando a viagem estiver definida.","videos":[{"titulo":"Qual o Melhor Programa de Milhas em 2026? A resposta que ninguém te dá!","canal":"DIA23","url":"https://www.youtube.com/watch?v=lrKzVS4lxVs","publicado":"2026-08-07","duracao":"23:51","auditoria":{"nota":8,"risco":"Baixo","veredito":"Compara Smiles, LATAM Pass e Azul Fidelidade por destino, não por 'ranking', e lembra que o que importa é o custo total da emissão, não a quantidade de milhas. Traz milheiro médio com período e fonte de cálculo (6 meses até jul/2026), o que é raro. Auditado pela descrição detalhada e pelos capítulos; a transcrição não estava acessível.","alerta":"Os valores de milheiro (ex.: Azul R$ 14,41, Smiles R$ 14,75, LATAM R$ 25,30) e os preços de emissão são fotos de jul/2026 e mudam rápido. Não compre milhas com base neles. O vídeo quase não fala dos programas de banco (Livelo, Esfera); veja o segundo vídeo."}},{"titulo":"Livelo ou Esfera: saiba de uma vez por todas qual programa focar!","canal":"Sara Reis","url":"https://www.youtube.com/watch?v=inGQpMTznwU","publicado":"2026-09-17","duracao":"15:16","auditoria":{"nota":7,"risco":"Baixo","veredito":"Comparação recente dos dois maiores programas de banco, com a conclusão honesta de que 'depende de como você junta e usa os pontos'. Auditado só por título e descrição curta (sem capítulos nem transcrição acessível): confiança menor.","alerta":"Você normalmente não escolhe o programa de banco: ele vem do seu cartão (ex.: Santander → Esfera; Bradesco e Banco do Brasil → Livelo). Não troque de cartão só por isso. Clubes de assinatura que aparecerem no vídeo são assunto da etapa 3."}}]},{"id":"cartao-sem-divida","nome":"Cartão de crédito sem dívida","porque":"Esta é a regra que vem antes de tudo: o cartão só serve para milhas se a fatura for paga inteira, todo mês. Os juros do rotativo estão entre os mais caros do país e um único mês de atraso apaga anos de pontos. Se a fatura não fecha, a prioridade é sair da dívida, não acumular milhas.","passos":["Ative o débito automático do valor TOTAL da fatura (não do mínimo) na conta onde cai o seu salário.","Defina no app do banco um limite de cartão que caiba na sua renda, menor que o limite aprovado se for preciso.","Toda semana, confira os lançamentos no app e compare o total com o que você tem em conta para pagar no vencimento.","Se um mês não fechar, não pague o mínimo: compare o CET do parcelamento da fatura com outras opções mais baratas (ex.: crédito pessoal, portabilidade) e pare de usar o cartão até zerar.","Só passe para a etapa 2 (escolher cartão por pontos) depois de três faturas seguidas pagas integralmente sem aperto."],"armadilhas":["Pagar o mínimo 'só este mês': o saldo restante vai para o rotativo, com juros que costumam passar de 10% ao mês.","Parcelar a fatura achando que não tem juros: o parcelamento da fatura cobra juros e IOF, só que menos que o rotativo.","Gastar mais ou pedir aumento de limite 'para pontuar mais': os pontos nunca cobrem juros, e o gasto extra é dinheiro que sai do seu bolso.","Passar no cartão contas de terceiros para 'ganhar pontos': você assume o risco do calote e consome o seu limite."],"dica":"Faça a conta antes de achar que vale a pena. Exemplo com números ilustrativos: fatura de R$ 2.000 num cartão que dá 1,5 ponto por real = 3.000 pontos. Mesmo valorizando o milheiro entre R$ 20 e R$ 30, isso dá R$ 60 a R$ 90. Um mês de rotativo a cerca de 15% ao mês sobre esses R$ 2.000 custa cerca de R$ 300, sem contar IOF. Os juros comem de 3 a 5 vezes o valor dos pontos.","videos":[{"titulo":"BC te Explica #166 - Por que o rotativo do cartão é tão caro e como evitar?","canal":"Banco Central do Brasil","url":"https://www.youtube.com/watch?v=8_dnQeaC5mI","publicado":"2026-02-27","duracao":"4:30","auditoria":{"nota":9,"risco":"Baixo","veredito":"Fonte oficial, curta e atual: explica o que é o rotativo, por que ele está entre as modalidades de crédito mais caras (junto com o cheque especial) e como não entrar nele. Zero interesse comercial. Auditado por título e descrição; o vídeo tem legenda manual, mas a transcrição não estava acessível.","alerta":"O vídeo não fala de milhas. Faça você a ligação: nenhum programa de pontos compensa juros de rotativo ou de parcelamento de fatura."}},{"titulo":"BC te Explica #102 - DÍVIDA no Cartão de Crédito agora tem LIMITE!","canal":"Banco Central do Brasil","url":"https://www.youtube.com/watch?v=QeSBuDfDd58","publicado":"2024-01-19","duracao":"5:35","auditoria":{"nota":8,"risco":"Baixo","veredito":"Explica a regra em vigor desde 03/01/2024: juros e encargos do rotativo e da fatura parcelada não podem passar do valor da dívida original. É de 2024, mas a regra continua valendo e o conceito não envelhece. Auditado por título e descrição.","alerta":"O teto de 100% não torna o rotativo barato: ele só impede que a dívida cresça para sempre. Ela ainda pode dobrar. O objetivo é nunca chegar lá."}}]},{"id":"validade-e-expiracao","nome":"Validade e expiração","porque":"Ponto e milha têm prazo de validade, e perder saldo por esquecimento é o prejuízo mais comum e mais evitável de todos. Os prazos variam por programa, pela origem do ponto (cartão, bônus, compra, clube) e até por lote dentro da mesma conta, então é preciso olhar o extrato, não confiar na memória.","passos":["Abra o extrato de cada programa onde você tem saldo (banco e companhias aéreas) e procure a data de vencimento de cada lote, não só o saldo total.","Monte uma planilha ou nota simples: programa, saldo, quantidade que vence e data de vencimento. Revise uma vez por mês.","Crie lembretes no celular 90 e 30 dias antes de cada vencimento relevante.","Antes de cancelar ou trocar de cartão, use ou transfira os pontos do programa próprio do banco: em muitos casos eles se perdem com o cancelamento.","Se algo vai vencer sem viagem à vista, compare as saídas: transferir para a companhia que você mais usa (zera o prazo lá, mas prende os pontos naquele programa), resgatar algo útil ou aceitar a perda de um saldo pequeno."],"armadilhas":["Achar que todo saldo tem a mesma validade: milhas bônus de transferência bonificada ou de promoções costumam vencer antes das milhas 'normais'.","Estocar milhas por anos 'para uma grande viagem': além de expirar, elas sofrem desvalorização quando o programa muda a tabela.","Pagar para reativar milhas vencidas sem fazer a conta: alguns programas cobram por isso, e o custo pode ser maior que o valor do resgate.","Confiar em listas de prazos de blogs: as regras mudam e as fontes divergem. Vale o regulamento e o extrato do programa."],"dica":"Perder é sempre o pior resultado, mas usar mal também custa. Exemplo com números ilustrativos: 8.000 pontos vencendo, trocados por produto a cerca de R$ 0,02 por ponto, valem R$ 160; perdidos, valem R$ 0. Se você ainda pretende viajar, transferir para a companhia que você usa costuma preservar mais valor. Melhor ainda é acumular só o que você vai usar nos próximos 12 a 24 meses (ritmo 'ganhe e gaste').","videos":[{"titulo":"PONTOS VENCENDO? O que fazer com Livelo e Esfera Santander!","canal":"Melhores Destinos","url":"https://www.youtube.com/watch?v=xRrdTHWS-W4","publicado":"2026-02-28","duracao":"8:01","auditoria":{"nota":7,"risco":"Baixo","veredito":"Curto, recente e voltado ao iniciante: o que fazer quando os pontos do banco estão para vencer e por que trocar por produto costuma ser mau negócio. Auditado por título e descrição (sem capítulos nem transcrição acessível): confiança média.","alerta":"Só cobre Livelo e Esfera. Cada programa e cada lote têm prazo próprio: confira no seu extrato. Se o vídeo sugerir transferência bonificada para salvar pontos, lembre que as milhas bônus podem vencer antes."}},{"titulo":"Milhas Expirando - O que fazer?","canal":"Melhores Destinos","url":"https://www.youtube.com/watch?v=ifw-TPp1wTQ","publicado":"2025-08-08","duracao":"1:04:26","auditoria":{"nota":6,"risco":"Médio","veredito":"Live que cobre o lado das companhias aéreas: como evitar o vencimento e o que fazer com milhas perto de expirar, mesmo sem viagem marcada. Fonte séria, mas longa, de 2025 e no formato de live, com divagações. Auditado por título e descrição.","alerta":"Os prazos citados podem ter mudado desde ago/2025; confirme no regulamento atual. Não compre milhas nem assine clube só para 'segurar' o vencimento de um saldo pequeno. A descrição traz links de indicação (Uber, Revolut) sem relação com a aula."}}]}]}],"materiais":[]},{"modulo":2,"nivel":"Básico","titulo":"Acumular no dia a dia","resumo":"Juntar pontos com o que você já gasta, sem gastar mais por causa deles: o cartão certo, as lojas parceiras e os acúmulos fora do cartão.","grupos":[{"tipo":"Acumular","aulas":[{"id":"escolher-o-cartao","nome":"Escolher o cartão","porque":"O cartão é o motor de quase todo o acúmulo, mas um cartão de pontos com anuidade cheia pode render menos do que um cartão simples de cashback. Escolher pela conta, e não pelo nome 'Black' ou pela propaganda, evita pagar para juntar pontos que você nem vai usar bem.","passos":["Some quanto você gasta por mês no cartão (média dos últimos 6 meses, sem contar gastos extraordinários).","Para cada cartão candidato, anote: pontos por dólar, se a conversão usa o dólar do dia da fatura, a anuidade cheia e a regra exata de isenção (gasto mínimo, investimento, relacionamento).","Calcule os pontos por ano (gasto anual ÷ cotação do dólar × pontos por dólar) e dê a eles um valor realista em reais; subtraia a anuidade que você de fato vai pagar. Use a calculadora 'A anuidade do cartão se paga?' do site.","Faça a mesma conta para um cartão de cashback sem anuidade e compare. Fique com o que der mais, considerando também se você realmente vai transferir e emitir passagens.","Se já tem um cartão caro que não se paga, ligue para o banco e peça isenção ou downgrade (troca para uma versão mais simples) antes de cancelar: assim você mantém o histórico e transfere os pontos acumulados antes."],"armadilhas":["Comparar só 'pontos por dólar' e esquecer a anuidade: 2,5 pontos por dólar com R$ 1.000 de anuidade pode perder para 1 ponto sem anuidade.","Contar com isenção que depende de gasto mínimo que você não atinge sem forçar compras; gastar mais para 'bater meta' destrói o ganho.","Dar aos pontos o valor de 'venda de milhas' ou do melhor resgate visto na internet. O valor que importa é o que você consegue nos seus resgates.","Cancelar o cartão com pontos no programa do banco: em muitos programas os pontos ficam presos ou expiram. Transfira ou use antes."],"dica":"Faça a conta inteira antes de pedir o cartão. Exemplo com números ilustrativos (mudam): gasto de R$ 3.000/mês, cartão de 2 pontos por dólar com anuidade de R$ 600, dólar a R$ 5,50. São R$ 36.000 ÷ 5,50 × 2 ≈ 13.090 pontos/ano. Valendo R$ 25 o milheiro, dá ≈ R$ 327, e com a anuidade o resultado fica em −R$ 273. Mesmo transferindo com 100% de bônus (≈ 26.180 milhas ≈ R$ 655), sobram só ≈ R$ 55 depois da anuidade. Um cartão de 1% de cashback sem anuidade devolve R$ 360 garantidos. Pontos só ganham se você conseguir isenção ou um valor de resgate bem maior.","videos":[{"titulo":"Cashback Ou Milhas: Qual Rende Mais Pra Você","canal":"Rodrigo Goes","url":"https://www.youtube.com/watch?v=aE4CCZTR6v8","publicado":"2026-07-10","duracao":"14:46","auditoria":{"nota":6,"risco":"Médio","veredito":"Tema central da aula, recente, e a proposta declarada é mostrar com conta quando cada opção vale mais, admitindo que para parte das pessoas cashback é melhor. Auditado só por título e descrição (sem transcrição), e a descrição é funil para curso pago e traz link de indicação do Méliuz.","alerta":"O resultado depende do valor que se dá ao milheiro. Refaça a conta com o valor que você realmente consegue nos seus resgates (nunca com preço de venda de milhas) e descontando a anuidade. O canal vende curso com promessa de retorno; ignore o funil."}},{"titulo":"Como escolher um cartão de crédito?","canal":"Melhores Destinos","url":"https://www.youtube.com/watch?v=bOw7Q45mqZE","publicado":"2025-07-04","duracao":"56:36","auditoria":{"nota":6,"risco":"Baixo","veredito":"Live de um canal sério sobre o método de escolha (perfil de gasto, pontuação, anuidade), sem promessa de renda. É longa, tem mais de um ano e a descrição é curta, então foi auditada com pouca confiança.","alerta":"Os cartões citados, suas pontuações e regras de isenção podem ter mudado desde julho de 2025. Aproveite o raciocínio e confira cada número no site do emissor antes de pedir o cartão."}}],"calc":2},{"id":"shoppings-de-pontos","nome":"Shoppings de pontos e lojas parceiras","porque":"Shopping Livelo, Shopping Smiles, Esfera e similares dão vários pontos por real em lojas conhecidas, às vezes bem mais que o cartão. Só que a compra bonificada só é vantagem se o produto já ia ser comprado e o preço for bom; senão, você está pagando caro por pontos.","passos":["Antes de comprar algo que você já planejava, pesquise o menor preço do produto (inclusive no Pix) em outras lojas.","Entre no shopping do programa (Livelo, Smiles, Esfera etc.), veja quantos pontos por real a loja dá hoje e acesse a loja pelo link do programa, logado na sua conta.","Calcule quanto você paga a mais em relação ao menor preço e divida pelos pontos que vai ganhar: isso é o custo do milheiro dessa compra. Só compre se esse custo for baixo para você.","Salve prints da oferta (pontos por real, regulamento e preço) e o número do pedido; desative bloqueadores de anúncio e não troque de aba no meio da compra.","Anote a data prevista de crédito dos pontos (costuma levar dias ou semanas) e cobre o programa com os prints se eles não caírem."],"armadilhas":["Comprar algo que você não ia comprar só por causa dos pontos: nesse caso o custo é o preço inteiro do produto.","Pagar mais caro na loja parceira do que em outra loja e não fazer a conta da diferença.","Achar que os pontos são garantidos: frete, cupons de fora, devoluções e algumas categorias costumam ficar de fora do cálculo, e o crédito pode atrasar ou não acontecer.","Deixar os pontos acumulados parados até vencerem."],"dica":"Faça a conta da diferença de preço. Exemplo ilustrativo: o produto custa R$ 699 no Pix em uma loja e R$ 777 numa parceira que dá 10 pontos por real (7.770 pontos). Você paga R$ 78 a mais, ou seja, R$ 78 ÷ 7,77 ≈ R$ 10 por milheiro. Se você costuma usar seus pontos valendo bem mais que isso, compensa. Agora outro caso: R$ 500 com 5 pontos por real (2.500 pontos) contra R$ 450 em outra loja. São R$ 50 por 2.500 pontos, R$ 20 o milheiro, e provavelmente não vale.","videos":[{"titulo":"Vale pagar R$ 78 a mais para ganhar 7.770 pontos na Black Friday? Compras Bonificadas","canal":"Joaquim - Portal Viajar","url":"https://www.youtube.com/watch?v=YGUXm0_G5j8","publicado":"2026-11-09","duracao":"17:29","auditoria":{"nota":8,"risco":"Baixo","veredito":"Exatamente o que a aula pede: compara o mesmo produto no Pix e no cartão, calcula o custo dos pontos pela diferença de preço e ensina a guardar comprovantes para quando os pontos não caem. Auditado por descrição e capítulos detalhados, sem transcrição.","alerta":"A conclusão do vídeo usa um valor de milheiro e uma transferência bonificada futura; se você não vai transferir e emitir, os pontos valem menos. Cuidado com a urgência da Black Friday: a conta só vale para o que você já ia comprar."}},{"titulo":"Compra Bonificada Vale Mesmo a Pena? Analisei Meus Gastos Reais!","canal":"Diego Branco","url":"https://www.youtube.com/watch?v=FHUljb3Y8Wo","publicado":"2026-10-08","duracao":"10:01","auditoria":{"nota":6,"risco":"Baixo","veredito":"Bom complemento: mostra pedidos reais (valor pago x pontos creditados) e discute quando compensa e quando evitar. Canal pequeno, com consultoria paga e link de indicação na descrição. Auditado só pela descrição e pelos capítulos.","alerta":"O 'valor real' dos pontos depende de como você resgata; refaça a conta com os seus números. Lembre que os pontos de shopping costumam demorar para cair e podem ter validade própria."}}]},{"id":"acumulo-fora-do-cartao","nome":"Acúmulo fora do cartão","porque":"Postos de combustível, apps de transporte e delivery, supermercados e o pagamento de contas podem somar pontos ao mesmo gasto que já passa pelo cartão. Mas alguns caminhos, como pagar boleto no cartão via app, cobram taxa, e aí o milheiro sai caro.","passos":["Liste seus gastos recorrentes que não pontuam hoje: combustível, mercado, apps, contas de consumo, escola, condomínio.","Para cada um, veja se há programa do próprio estabelecimento ligado a Livelo, Smiles, LATAM Pass ou Azul (postos, redes de mercado, apps) e cadastre o mesmo CPF da sua conta no programa.","Some os pontos do programa parceiro aos do cartão: é o mesmo gasto pontuando duas vezes, sem gastar mais.","Antes de pagar uma conta ou boleto no cartão por app, veja a taxa de conveniência e calcule o custo do milheiro (taxa em reais ÷ pontos ganhos × 1.000). Se passar do que você paga normalmente pelos pontos, não faça.","Confira de tempos em tempos se os pontos de parceiros estão caindo; regras e paridades mudam sem muito aviso."],"armadilhas":["Pagar boleto no cartão com taxa de 3% a 5% achando que é 'de graça': a taxa quase sempre torna o milheiro caríssimo.","Usar o pagamento de contas no cartão para empurrar a dívida para o mês seguinte. Se a fatura não fecha, o rotativo come qualquer ganho em pontos.","Trocar de posto ou mercado para um mais caro só por causa dos pontos.","Cadastrar CPF diferente ou esquecer de vincular a conta do programa e perder o crédito."],"dica":"Calcule o milheiro da taxa antes de pagar uma conta no cartão. Exemplo ilustrativo: um boleto de R$ 1.000 com taxa de 3,99% (R$ 39,90), num cartão de 2 pontos por dólar, com dólar a R$ 5,50, gera ≈ 378 pontos (R$ 1.039,90 ÷ 5,50 × 2). Você pagou R$ 39,90 por 378 pontos, ou R$ 105 por milheiro, muito acima do que qualquer resgate comum entrega. Taxa de conveniência só faz sentido em caso muito específico, como bater uma meta de bônus que você já calculou.","videos":[{"titulo":"Dá para acumular milhas sem ter cartão de crédito?","canal":"Passageiro de Primeira","url":"https://www.youtube.com/watch?v=4v5hKrkbhDM","publicado":"2026-10-14","duracao":"14:54","auditoria":{"nota":7,"risco":"Baixo","veredito":"Visão geral recente, de canal tradicional, sobre fontes de acúmulo fora do cartão (voos, apps de transporte, compras bonificadas), sem promessa de renda. A descrição é curta, então foi auditado com pouca confiança.","alerta":"Os pontos de parceiros costumam ser poucos por real; não espere grande volume. Confira as regras atuais de cada parceiro no site do programa, porque elas mudam com frequência."}},{"titulo":"🎫 Pague Boleto no Cartão 2026 (Sem taxas e com taxas) | Papo de Milhas","canal":"Papo de Milhas com João Paulo","url":"https://www.youtube.com/watch?v=WK8idw8XlM8","publicado":"2025-10-05","duracao":"11:54","auditoria":{"nota":7,"risco":"Médio","veredito":"Lista na descrição as taxas de vários apps para pagar boletos e contas no cartão e faz a conta do custo do milheiro: no próprio exemplo, um boleto de R$ 3.000 com 2,95% de taxa gera pontos a ≈ R$ 34 o milheiro. Conferi a conta e ela bate. Auditado pela descrição, sem transcrição.","alerta":"As taxas mudam com frequência; confira no app antes de pagar. O exemplo usa um cartão de altíssima renda (5 pontos por dólar); com um cartão comum o milheiro sai muito mais caro. Nunca use o pagamento de contas no cartão para rolar dívida."}}]},{"id":"milhas-voando","nome":"Milhas voando: utilizáveis x qualificáveis","porque":"Quem compra passagem em dinheiro e não pede as milhas está deixando pontos na mesa. Também é preciso separar as milhas que você gasta em passagens (utilizáveis) dos pontos que só servem para subir de categoria (qualificáveis), porque status raramente compensa para quem voa pouco.","passos":["Cadastre-se de graça nos programas das companhias em que você voa e coloque o número de fidelidade em toda reserva paga.","Depois do voo, confira se as milhas e os pontos qualificáveis caíram; se não, peça o crédito retroativo no site ou app dentro do prazo do programa, com o localizador e o número do bilhete.","Entenda que passagem emitida com milhas, em geral, não gera milhas nem pontos qualificáveis, e que tarifas mais baratas (tipo 'basic') pontuam menos.","Calcule quantos pontos qualificáveis você junta por ano voando e com o cartão e compare com o primeiro nível. Se não chega perto, não mude seu comportamento para correr atrás de status.","Se voa por uma aliança, veja se vale mais creditar o voo em um programa parceiro (por exemplo, um estrangeiro) do que no da companhia."],"armadilhas":["Escolher voo mais caro ou com conexão só para juntar qualificáveis: o custo extra quase sempre supera o benefício.","Esquecer de colocar o número de fidelidade e perder o prazo do crédito retroativo.","Assinar clube ou cartão caro só porque 'dá status' sem saber se os benefícios (bagagem, assento, upgrade) você realmente usaria.","Achar que status garante upgrade: depende de tarifa, de assento livre e de fila de prioridade."],"dica":"Antes de sonhar com status, faça a conta. Exemplo com regras ilustrativas (variam por programa e mudam): se o programa dá 3 pontos qualificáveis por real em tarifa e o primeiro nível pede 12.000, você precisaria de R$ 4.000 por ano em passagens pagas, sem contar taxas. Se você gasta R$ 800 por ano com voos, chega a 2.400 pontos, 20% do caminho. Nesse caso, foque em creditar as milhas utilizáveis e esqueça o status.","videos":[{"titulo":"LATAM PASS Ainda Vale a Pena em 2026? Como Funciona o Programa (Guia Completo)","canal":"DIA23","url":"https://www.youtube.com/watch?v=M4ZB4IYH1-o","publicado":"2026-10-22","duracao":"20:45","auditoria":{"nota":7,"risco":"Médio","veredito":"Explica bem a diferença entre milha e ponto qualificável (passagem com milhas não gera nenhum dos dois, e o ponto qualificável não se compra nem se transfere), mostra quanto voo e cartão geram e tem o capítulo 'o cartão sozinho não te leva ao Gold'. É focado só na LATAM. Auditado pela descrição e pelos capítulos, que são bem detalhados.","alerta":"O 'valor da milha' do vídeo vem de preços de balcão de compra e venda de milhas. Esse não é o valor para você, e vender milhas viola o regulamento e pode levar a bloqueio. Os números de categorias, clubes e tabela são de outubro de 2026 e mudam."}},{"titulo":"VALE A PENA SUBIR DE STATUS NA LATAM PASS? ANÁLISE SINCERA","canal":"GuNasPraias","url":"https://www.youtube.com/watch?v=XAId7sdm22E","publicado":"2026-09-24","duracao":"9:51","auditoria":{"nota":6,"risco":"Baixo","veredito":"Questiona com ceticismo se correr atrás de status compensa: fala da dificuldade de chegar ao topo, de upgrades que viraram leilão e compara com Azul e Smiles. É curto e recente. Tem um capítulo de propaganda da assessoria do autor. Auditado pela descrição e pelos capítulos.","alerta":"O vídeo mira quem gasta bastante e quer executiva; para iniciante, a conclusão prática costuma ser 'não persiga status'. Pule o trecho da assessoria paga (07:15)."}}]}]}],"materiais":[]},{"modulo":3,"nivel":"Intermediário","titulo":"Transferir e fazer a conta","resumo":"Levar os pontos do banco para a companhia aérea na hora certa e saber quanto cada milheiro custou. É aqui que se ganha ou se perde dinheiro.","grupos":[{"tipo":"Transferir","aulas":[{"id":"transferir-pontos","nome":"Transferir pontos para companhias aéreas","porque":"A transferência é o momento em que o ponto do banco, que ainda pode ir para vários programas, vira milha presa a uma única companhia aérea. Ela não tem volta: transferir cedo demais, para o programa errado ou para uma conta com dados diferentes custa caro. Conhecer a paridade, o prazo de crédito e a regra do mesmo CPF evita perder pontos e bônus.","passos":["Antes de transferir, tenha um destino: pesquise a passagem (datas, ida e volta) e veja quantas milhas ela custa em cada programa para o qual o seu banco transfere.","Confira se a conta na companhia aérea está no seu nome e no mesmo CPF da conta do banco, com cadastro completo. Em regra, a transferência só é aceita entre contas do mesmo titular.","No site do programa de banco, veja a paridade (quantos pontos viram 1 milha: muitas vezes 1:1 nas companhias nacionais, mas há parceiros com 2:1), o mínimo por transferência e o prazo de crédito. Isso muda: confira no dia.","Na primeira vez com um parceiro, faça uma transferência pequena e guarde o comprovante.","Depois, confira o extrato da companhia: as milhas básicas costumam cair antes do bônus. Anote a validade de cada lote."],"armadilhas":["Transferir 'para não perder' sem ter viagem em vista: a milha não volta para o banco, e a companhia pode mudar a tabela de resgate.","Transferir sem bônus quando não há pressa: ao longo do ano costumam aparecer campanhas com bônus (próxima aula).","Erro de cadastro (CPF, nome ou número de fidelidade diferentes) que trava ou bloqueia o crédito.","Contar com a tarifa vista hoje enquanto as milhas não caem: se o crédito leva dias, a passagem pode mudar de preço ou sumir.","Deixar para a véspera do vencimento dos pontos: a transferência também tem prazo de processamento."],"dica":"Faça a conta da paridade antes de clicar. Exemplo com números fictícios: 30.000 pontos numa paridade 1:1 viram 30.000 milhas; numa paridade 2:1, viram 15.000. Se a passagem custa 25.000 milhas, só a primeira opção resolve. E se o saldo cobre a passagem com sobra, transfira só o necessário (respeitando o mínimo do programa): o que fica no banco continua flexível.","videos":[{"titulo":"Como transferir os pontos do cartão para companhias aéreas e ganhar bônus?","canal":"Passageiro de Primeira","url":"https://www.youtube.com/watch?v=EfPGlYR_ceE","publicado":"2026-08-06","duracao":"10:31","auditoria":{"nota":7,"risco":"Baixo","veredito":"Recente e de canal sério: explica como levar os pontos do cartão para as companhias, as regras das campanhas, quando vale transferir e os cuidados para não desperdiçar milhas. Sem promessa de renda. Auditado por título e descrição (sem capítulos; a legenda automática existe, mas a transcrição não estava acessível).","alerta":"A descrição traz um link rastreado de assinatura do Clube Livelo, sem aviso de publicidade. Não assine clube por causa deste vídeo: clubes têm aula própria nesta etapa. Paridade, prazo de crédito e bônus mudam: confira no regulamento do dia."}},{"titulo":"Como transferir pontos Livelo para o Azul Fidelidade | Passo a Passo","canal":"Azul Linhas Aéreas Brasileiras","url":"https://www.youtube.com/watch?v=2TR0wbs_lFk","publicado":"2026-08-18","duracao":"0:54","auditoria":{"nota":6,"risco":"Baixo","veredito":"Tutorial oficial de menos de um minuto que mostra o caminho da transferência no app. Serve para ver as telas, não para decidir. Auditado por título e descrição.","alerta":"É uma peça da própria Azul ('rápido e fácil'): não avisa que a transferência é irreversível, nem que pode valer esperar uma campanha com bônus e se cadastrar nela antes. As telas do app mudam com o tempo."}}]},{"id":"transferencia-bonificada","nome":"Transferência bonificada","porque":"Na transferência bonificada, a companhia aérea (às vezes junto com o banco) dá milhas extras sobre os pontos transferidos durante uma campanha. É a forma mais comum de baixar o custo de cada milha sem gastar mais. Mas o bônus só ajuda quando você já ia transferir e tem onde usar as milhas.","passos":["Acompanhe por algumas semanas as campanhas dos programas que você usa (apps e blogs de milhas) e anote os percentuais. Assim você aprende o que é bônus comum e o que é bônus bom para cada programa.","Leia o regulamento: faixas de bônus (por categoria, por clube, por valor transferido), limite de milhas bônus, prazo de crédito e validade das milhas bônus.","Faça o cadastro na página da campanha, quando houver, ANTES de transferir, e guarde um print.","Transfira dentro do prazo, com o mesmo CPF, e confira se o bônus caiu no prazo prometido. Se não cair, reclame com o número do protocolo.","Se a campanha tiver bumerangue (a Livelo devolve parte dos pontos transferidos), anote quando os pontos voltam e quando eles vencem."],"armadilhas":["Transferir porque o bônus está alto, sem destino: 100% de bônus sobre milhas que vencem sem uso é prejuízo total.","Contar com o bônus máximo anunciado ('até X%'): a sua faixa depende de categoria, clube e valor transferido.","Assinar um clube só para pegar a faixa maior sem pôr a mensalidade na conta do CPM.","Esquecer que as milhas bônus costumam vencer antes das milhas básicas.","Esperar para sempre o bônus perfeito: as faixas mudam, e os pontos do banco também vencem."],"dica":"Calcule o bônus efetivo. Exemplo com números fictícios: você transfere 10.000 pontos com 80% de bônus e recebe 18.000 milhas. Se a campanha tiver bumerangue de 20%, a Livelo devolve 2.000 pontos semanas depois. Se esses 2.000 pontos forem transferidos de novo numa campanha de 80%, viram mais 3.600 milhas: 21.600 no total, ou 116% a mais que os 10.000 pontos de partida. Sem nova campanha, os 2.000 pontos ficam no banco. Os percentuais de bônus e de bumerangue mudam a cada campanha.","videos":[{"titulo":"NÃO TRANSFIRA seus pontos antes de ver esse vídeo!","canal":"Melhores Destinos","url":"https://www.youtube.com/watch?v=0LttdJlTrz8","publicado":"2026-02-04","duracao":"9:19","auditoria":{"nota":8,"risco":"Baixo","veredito":"O título é chamativo, mas o conteúdo é sério: como decidir entre transferir agora ou esperar, com base numa matéria do Melhores Cartões (jan/2026). A matéria traz bônus de referência por programa, admite que não dá para prever a próxima campanha e recomenda não estocar milhas. Auditado pela descrição e pela matéria ligada; o vídeo tem legenda manual, mas a transcrição não estava acessível.","alerta":"Os bônus de referência (em jan/2026: Azul 90%, Smiles 80%, LATAM 30%) são uma foto daquele momento. Meses depois, outras fontes já tratavam 70% como o novo normal para a Azul. Use como régua, não como regra: o que decide é o CPM final e ter destino."}},{"titulo":"QUANDO VALE A PENA TRANSFERIR MEUS PONTOS (LATAM, Azul e Smiles) | Fontes de Pontos","canal":"Fontes de Pontos","url":"https://www.youtube.com/watch?v=h9HVRHT1PtU","publicado":"2026-03-08","duracao":"7:55","auditoria":{"nota":7,"risco":"Baixo","veredito":"Curto e didático: o que é a transferência bonificada, um exemplo real de Livelo para Azul, quanto cada programa costuma bonificar e quanto de bônus vale aproveitar. Canal pequeno, sem venda de produto na descrição. Auditado por título, descrição e capítulos.","alerta":"As faixas de bônus 'de costume' refletem o histórico até mar/2026. A descrição fala em 'multiplicar milhas': o bônus só reduz custo se você já ia transferir. O vídeo não trata de bumerangue nem da validade menor das milhas bônus; veja o texto desta aula."}}]}]},{"tipo":"Fazer a conta","aulas":[{"id":"cpm-custo-do-milheiro","nome":"CPM: o custo do milheiro","porque":"O CPM (custo por milheiro) é quanto você pagou, em reais, por cada 1.000 milhas que chegaram na conta. Sem ele não dá para saber se um clube, uma compra de pontos ou uma transferência foi bom negócio, nem se vale usar milhas ou pagar a passagem em dinheiro. É a conta que separa economia de ilusão.","passos":["Some tudo o que você pagou para ter as milhas: compra de pontos, mensalidade de clube, taxas. Para pontos que vieram do cartão sem custo extra, use quanto custaria repor esses pontos numa promoção.","Calcule as milhas recebidas: pontos × paridade × (1 + bônus). Ex.: 10.000 pontos, paridade 1:1 e 70% de bônus = 17.000 milhas.","CPM = total pago ÷ milhas recebidas × 1.000. Use a calculadora 'Custo (CPM)' do site e refaça as contas que aparecem nos vídeos.","Na hora de emitir, calcule o valor do resgate: (preço em dinheiro − taxas do resgate) ÷ milhas × 1.000, e compare com o seu CPM (calculadora 'Usar milhas?').","Registre numa planilha simples: data, origem, custo, milhas, CPM e validade. Com o tempo você tem um CPM médio por programa."],"armadilhas":["Comparar CPM entre programas como se fosse a mesma moeda: cada companhia cobra quantidades diferentes de milhas pelo mesmo voo, então R$ 15 num programa pode ser caro e R$ 22 em outro pode ser barato.","Confundir milheiro de pontos do banco com milheiro de milhas: R$ 30 por 1.000 pontos não é R$ 30 por 1.000 milhas; depende do bônus da transferência.","Esquecer custos: mensalidade de clube, anuidade paga só pelos pontos, taxas de embarque do resgate.","Tratar o 'milheiro de referência' de um vídeo como meta fixa: essas faixas mudam a cada poucos meses.","Usar o preço de venda de milhas em balcões como 'valor' das suas milhas: vender viola os regulamentos (etapa 7)."],"dica":"Exemplo com números fictícios, igual à calculadora: você pagou R$ 300 por 10.000 pontos e transferiu com 70% de bônus, recebendo 17.000 milhas. CPM = 300 ÷ 17 = R$ 17,65. Agora o resgate: passagem de R$ 600 em dinheiro ou 25.000 milhas + R$ 50 de taxa. Valor do milheiro = (600 − 50) ÷ 25 = R$ 22,00. Como R$ 22,00 passa de R$ 17,65 com folga (mais de 15%, a margem que a calculadora usa), usar milhas compensa. Se a mesma passagem custasse R$ 450, o valor cairia para (450 − 50) ÷ 25 = R$ 16,00, e pagar em dinheiro seria melhor.","videos":[{"titulo":"COMO CALCULAR O VALOR DO MILHEIRO: Azul, Smiles e LATAM - Dicas e Promoções!","canal":"Vivi por aí - Milhas","url":"https://www.youtube.com/watch?v=5nQBfWrSsBA","publicado":"2025-02-16","duracao":"21:50","auditoria":{"nota":7,"risco":"Baixo","veredito":"O miolo do vídeo (de 03:38 a 14:50) ensina a calcular o milheiro em promoções diferentes: compra com desconto, transferência bonificada e compra no carrinho. O método não envelhece. Sem venda de produto na descrição. É de fev/2025. Auditado por título, descrição e capítulos.","alerta":"As referências do fim do vídeo (R$ 15 para Smiles e Azul, R$ 24 para LATAM) são de fev/2025: não use como meta hoje. Apesar do título, o foco é o custo de aquisição; comparar com o valor do resgate é o segundo passo (veja o outro vídeo). Refaça as contas na calculadora de CPM do site."}},{"titulo":"Smiles: por que sua milha barata não vira passagem barata?","canal":"O PLANEJANTE","url":"https://www.youtube.com/watch?v=nC2VLSN4t5w","publicado":"2026-10-10","duracao":"15:05","auditoria":{"nota":7,"risco":"Baixo","veredito":"Liga o CPM ao custo real da emissão: milha comprada barata não garante passagem barata. A descrição lista os dados usados, com 'verificado em outubro de 2026' e aviso de que as regras mudam, uma transparência rara. Canal pequeno, sem venda de produto. Auditado por título e descrição detalhada.","alerta":"É focado em Smiles e cobre muita coisa em 15 minutos (Viaje Fácil, parceiras, buscadores, conta família), que são temas das etapas 4 e 6. Aqui, preste atenção na parte de CPM e de custo da emissão. Os números citados (ex.: bônus Livelo → Smiles e validade de 12 meses das milhas bônus) são de out/2026."}}],"calc":1},{"id":"clubes-de-assinatura","nome":"Clubes de assinatura","porque":"Clube de assinatura é uma mensalidade que entrega pontos ou milhas todo mês, mais vantagens como bônus maior nas transferências, descontos e, em alguns, pontos que não vencem enquanto o clube estiver ativo. Ele pode baixar o seu CPM, mas é um gasto fixo que continua saindo da conta quando você para de viajar. A decisão é de conta, não de promessa.","passos":["Calcule o CPM do clube: mensalidades do período ÷ (pontos do plano + bônus de adesão) × 1.000. Se forem pontos de banco, divida também por (1 + bônus típico de transferência) para ter o custo por milha. Use a calculadora 'Custo (CPM)'.","Compare com a alternativa avulsa: comprar pontos ou milhas em promoção só quando houver uma passagem em vista.","Só assine com promoção de adesão e leia o regulamento: permanência mínima e multa, como o bônus é pago (às vezes parcelado), o que acontece com a validade dos pontos se cancelar e se há carência para nova promoção depois de cancelar.","Escolha o clube do programa que você usa de verdade: o do banco, se ainda não tem destino definido; o da companhia, se já sabe por onde vai voar.","Ponha um lembrete para revisar o clube a cada 6 meses e antes de a promoção de adesão acabar. Cancele ou reduza o plano se a conta não fechar."],"armadilhas":["Assinar pelo bônus de adesão e esquecer que depois vem a mensalidade cheia, com CPM bem maior.","Plano maior que o uso: pontos acumulando sem destino, sujeitos à desvalorização.","Cancelar sem ler o regulamento: os pontos do clube podem passar a vencer, e pode haver um período sem acesso a novas promoções de adesão.","Trocar um plano antigo por um novo sem fazer a conta: o Clube Livelo mudou em out/2026 e planos antigos podem ter condições que não voltam.","Somar vários clubes 'porque cada um dá um benefício': a soma das mensalidades passa fácil do que você economiza."],"dica":"Exemplo com números fictícios: clube de R$ 50 por mês que dá 1.000 pontos/mês, com bônus de adesão de 12.000 pontos no primeiro ano. Em 12 meses: R$ 600 pagos e 24.000 pontos. Custo: 600 ÷ 24 = R$ 25 por milheiro de pontos. Transferidos com 80% de bônus, viram 43.200 milhas: 600 ÷ 43,2 = R$ 13,89 por milheiro de milhas. No segundo ano, sem o bônus de adesão: 600 ÷ 12 = R$ 50 por milheiro de pontos e 600 ÷ 21,6 = R$ 27,78 por milheiro de milhas. Por isso a regra é revisar o clube quando a promoção acaba.","videos":[{"titulo":"Comparativo completo de clubes de pontos e milhas 2026 | ALL, Azul, Smiles, Latam, Livelo, Esfera","canal":"Pedro Gerador | Viagens sem perrengue","url":"https://www.youtube.com/watch?v=6jE4WYNF7Nk","publicado":"2026-06-25","duracao":"30:58","auditoria":{"nota":7,"risco":"Médio","veredito":"Compara sete clubes (Livelo, Esfera, ALL Accor, Azul, Smiles, LATAM Pass e TAP), com planilha pública, e diz qual o autor assina e por quê. Bom para aprender a lógica do custo de cada clube. Auditado por título e descrição.","alerta":"Gravado em jun/2026, antes de duas mudanças: o Clube Livelo trocou 7 planos por 3 (Essencial, Especial e Premium) em out/2026, e o LATAM Pass anunciou um clube novo em out/2026. Aproveite a lógica, não os preços. Ignore a consultoria paga da descrição; os links de adesão são de campanhas de junho."}},{"titulo":"Clube Livelo vale a pena em 2026? Estou perto de cancelar","canal":"Lucas Fialho - Pense Como Rico","url":"https://www.youtube.com/watch?v=FbyZMrNnmN4","publicado":"2026-10-21","duracao":"11:24","auditoria":{"nota":7,"risco":"Médio","veredito":"Um assinante antigo refaz a conta do próprio clube depois da queda do bônus para a Azul e conclui que, no plano mais caro, pagou mais que quem comprou pontos + dinheiro. É um bom exemplo de revisar (e cancelar) um clube. A conta da descrição confere: pontos a R$ 30 o milheiro com 70% de bônus = 30 ÷ 1,7 ≈ R$ 17,65 (o vídeo diz R$ 17,64). Auditado por descrição e capítulos.","alerta":"Parte do vídeo é opinião, e o próprio autor chama de hipótese a 'rixa' entre Azul e Livelo. A descrição empurra curso de agência de viagens e um treinamento 'como viajar de graça': ignore. Antes de cancelar, veja no regulamento o que acontece com a validade dos pontos e com o bônus por tempo de clube."}}],"calc":1},{"id":"compra-de-pontos","nome":"Compra de pontos com desconto","porque":"Programas de banco e companhias aéreas vendem pontos e milhas o tempo todo, muitas vezes com 'desconto' ou bônus. Comprar pode completar o saldo de uma passagem que já está boa. Comprar para estocar é apostar dinheiro em algo que pode vencer ou valer menos amanhã. A compra só faz sentido com destino e com o CPM final calculado.","passos":["Primeiro ache a passagem e veja quantas milhas faltam. Só depois pense em comprar.","Compare os caminhos: comprar direto na companhia (com bônus), comprar pontos no banco com desconto e transferir com bônus, ou usar pontos + dinheiro no carrinho. Calcule o CPM final de cada um na calculadora 'Custo (CPM)'.","Compare o CPM final com o valor do resgate: (preço em dinheiro − taxas) ÷ milhas × 1.000. Se não ganhar com folga, pague a passagem em dinheiro.","Leia o regulamento: prazo de crédito da compra e da transferência, limite por CPF e se dá para cancelar a compra. As milhas precisam chegar antes de a tarifa sumir.","Pague só se couber no orçamento do mês. Nunca use rotativo ou parcelamento com juros para comprar pontos."],"armadilhas":["Olhar o percentual de desconto e não o preço final: '56% de desconto' sobre um preço cheio alto ainda pode dar um milheiro caro.","Comprar sem destino: dinheiro parado em milhas que podem vencer, desvalorizar ou ficar presas num programa que não serve.","Comprar pontos no banco contando com um bônus de transferência que ainda não foi anunciado.","Comprar para revender: viola os regulamentos e traz risco de bloqueio e de calote (etapa 7)."],"dica":"Exemplo com números fictícios: 20.000 pontos a R$ 30,80 o milheiro = R$ 616. Transferidos com 70% de bônus, viram 34.000 milhas: CPM = 616 ÷ 34 = R$ 18,12. A passagem custa R$ 700 em dinheiro ou 30.000 milhas + R$ 60 de taxa: valor do milheiro = (700 − 60) ÷ 30 = R$ 21,33, acima de R$ 18,12 com mais de 15% de folga (R$ 20,84). Compensa. Se a passagem custasse R$ 500, o valor seria (500 − 60) ÷ 30 = R$ 14,67: pague em dinheiro. E lembre que as 4.000 milhas que sobraram também custaram dinheiro.","videos":[{"titulo":"Como funciona pontos mais dinheiro ou Hack do carrinho da Livelo e Esfera?","canal":"Melhores Destinos","url":"https://www.youtube.com/watch?v=HUtz9S0hbGo","publicado":"2026-06-06","duracao":"12:01","auditoria":{"nota":8,"risco":"Baixo","veredito":"Explica a compra de pontos 'no carrinho' (pontos + dinheiro) para completar o saldo de uma emissão já encontrada. Tem capítulos com os números, como saber se o milheiro está caro ou barato e um capítulo sobre por que não vale para todo mundo. Auditado por título, descrição e capítulos.","alerta":"'Hack' e 'bug' são só apelidos: é uma compra de pontos normal, e só compensa se o CPM final ficar abaixo do valor da passagem que você já achou. A disponibilidade de pontos + dinheiro e os preços mudam."}},{"titulo":"Comprar pontos Livelo com desconto virou ARMADILHA? NÃO VALE a pena mais por que?","canal":"Lucas Fialho - Pense Como Rico","url":"https://www.youtube.com/watch?v=HmP3ATur6Sw","publicado":"2026-08-25","duracao":"8:22","auditoria":{"nota":7,"risco":"Médio","veredito":"Contraponto útil: mostra que mesmo 56% de desconto ainda deixa o milheiro de pontos Livelo em R$ 30,80 e discute o risco de estocar pontos comprados. A conta confere: 56% de desconto sobre um preço cheio de R$ 70 dá R$ 30,80; com mais 5% no Pix, R$ 29,26. Auditado por descrição e capítulos.","alerta":"R$ 30,80 é o custo de 1.000 pontos Livelo, não de 1.000 milhas: o custo da milha depende do bônus da transferência (com 70%, cerca de R$ 18,12). O último capítulo e os links da descrição fazem propaganda de curso de agência de viagens, que não tem a ver com a aula."}}],"calc":1}]}],"materiais":[]},{"modulo":4,"nivel":"Intermediário","titulo":"Emitir passagens","resumo":"Transformar milhas em assento: buscar, comparar com o preço em dinheiro, emitir e saber o que fazer se o plano mudar.","grupos":[{"tipo":"Emitir","aulas":[{"id":"emitir-passo-a-passo","nome":"Emitir com milhas, passo a passo","porque":"É na emissão que o esforço de acumular vira (ou não) uma viagem. Os erros mais caros acontecem aqui, e quase todos são de conferência: nome diferente do documento, data errada, tarifa sem bagagem, beneficiário que gasta uma vaga do limite de CPFs. Uma emissão bem feita leva 15 minutos a mais e evita taxa de correção, remarcação ou passagem perdida.","passos":["Pesquise primeiro no site ou app oficial do programa (Smiles, LATAM Pass, Azul Fidelidade), sempre logado na sua conta, e use o calendário ou a busca de datas flexíveis para ver os dias mais baratos em milhas.","Abra, numa outra aba, o preço em dinheiro do mesmo voo, na mesma tarifa e com a mesma bagagem: sem esse número você não sabe se a emissão vale a pena (aula seguinte).","Antes de pagar, confira passageiro por passageiro: nome e sobrenome iguais ao documento que será usado no embarque, CPF, data de nascimento. Para quem não é você, veja quantas vagas de beneficiário o programa permite e por quanto tempo a vaga fica presa.","Leia as regras da tarifa (bagagem, assento, remarcação, cancelamento) e o resumo de cobranças: milhas, taxa de embarque e eventual taxa de emissão ou resgate. Pague as taxas no cartão, de preferência à vista.","Guarde o localizador e o e-mail de confirmação, confira a reserva também no site da companhia aérea que vai operar o voo e faça o check-in pelo canal oficial."],"armadilhas":["Emitir por link recebido em WhatsApp, e-mail ou anúncio: golpes copiam a tela dos programas. Entre sempre digitando o endereço ou pelo app oficial; alguns programas passaram a pedir biometria facial na emissão, e isso só deve ser feito dentro do app oficial.","Gastar a vaga de beneficiário com quem talvez não viaje: em vários programas o limite de CPFs por período é pequeno e a vaga continua contando mesmo se a passagem for cancelada.","Achar que o menor número de milhas é a melhor emissão: às vezes a tarifa mais barata não tem mala, tem conexão longa ou não permite remarcar.","Errar o nome e só perceber no aeroporto: correção depois da emissão pode ter custo ou exigir nova emissão."],"dica":"Antes de clicar em 'confirmar', tire um print da tela de resumo (milhas, taxas, regras da tarifa e nomes). Se der problema depois, esse print é a sua prova junto ao programa, à ANAC ou ao consumidor.gov.br. E não emita na pressa: o assento que some em 10 minutos costuma reaparecer em outra data ou em outro programa, e a sua conta do milheiro continua valendo.","videos":[{"titulo":"Como Emitir na Smiles: Parceiros, Limite de CPFs, Viaje Fácil e Benefícios","canal":"Marcos Koler","url":"https://www.youtube.com/watch?v=fByGAB1_70g","publicado":"2026-09-18","duracao":"32:12","auditoria":{"nota":7,"risco":"Baixo","veredito":"Aula prática e recente (set/2026) de emissão na Smiles que, pela descrição, cobre pesquisa, emissão em parceiras, limite de CPFs, cuidados no cadastro de passageiros e 'como avaliar se uma emissão realmente compensa', com aviso explícito de que regras e valores mudam. Sem promessa de renda; o canal divulga grupos de alerta e um sistema próprio de gestão de milhas. Auditado pela descrição; a legenda não estava acessível e o vídeo não tem capítulos.","alerta":"São 32 minutos e parte do conteúdo (Teto Diamante, passagem cortesia, Viaje Fácil) é para quem já tem categoria ou quer parcelar: foque na busca, no cadastro de passageiros e no limite de CPFs. O 'Viaje Fácil' é reserva antes de ter as milhas; não use isso como motivo para comprar milhas sem fazer a conta."}},{"titulo":"Como Emitir Passagens na LATAM: Limite de CPFs, Tarifas e Estratégias","canal":"Marcos Koler","url":"https://www.youtube.com/watch?v=0n_bzj0GV9w","publicado":"2026-09-18","duracao":"36:17","auditoria":{"nota":7,"risco":"Baixo","veredito":"Mesma série, mesma data: emissão no LATAM Pass com limite de CPFs, cadastro de passageiros, diferenças entre tarifas, tabela fixa, remarcações e, segundo a descrição, 'por que comparar o valor em pontos com o preço em dinheiro'. Tom didático e sem hype. Auditado pela descrição; a legenda não estava acessível e o vídeo não tem capítulos.","alerta":"Os limites de CPF e as regras de remarcação citados valem para a data da gravação: confira no regulamento antes de emitir para terceiros. Quem usa Azul tem a aula equivalente no mesmo canal ('Emitindo Passagens na Azul: Guia Completo Passo a Passo'). Ignore o convite para o sistema pago de gestão: uma planilha simples resolve."}}]},{"id":"milhas-ou-dinheiro","nome":"Tabela fixa x dinâmica: milhas ou dinheiro?","porque":"Com a tabela dinâmica, o preço em milhas acompanha o preço em dinheiro: quando a passagem está barata em reais, ela também está barata em milhas, e às vezes pagar em dinheiro sai melhor. Na tabela fixa (ou tarifa 'award'), o programa cobra um número fixo de milhas por trecho ou região, desde que haja assento liberado; é aí que costumam aparecer os melhores resgates. Saber qual das duas você está vendo, e fazer a conta, evita queimar milhas em um resgate ruim.","passos":["Para o mesmo voo, anote quatro números: o preço em dinheiro (mesma tarifa e bagagem), as milhas pedidas, as taxas cobradas no resgate e quanto custou o seu milheiro (CPM, da etapa 3).","Coloque esses números na calculadora 'Vale usar milhas nesta passagem?' do site. Ela calcula o valor do milheiro no resgate: (preço em dinheiro − taxas) ÷ (milhas ÷ 1.000).","Compare com o seu CPM: se o resgate vale bem mais do que o milheiro custou, use milhas; se vale menos, pague em dinheiro e guarde as milhas para um resgate melhor.","Veja se a emissão é tabela fixa/award (número redondo de milhas, igual em várias datas) ou dinâmica/comercial (número que muda junto com o preço em dinheiro). Na dinâmica, a conta quase sempre fica perto do 'empate'.","Se as milhas vieram do cartão, use como CPM quanto custaria repor essas milhas (comprar ou transferir com bônus), e não zero: milha 'de graça' tem custo de oportunidade."],"armadilhas":["Comparar com o preço em dinheiro de outra data, outra tarifa ou sem a mala: a comparação precisa ser do mesmo produto.","Esquecer que a passagem paga em dinheiro também gera pontos no cartão e milhas voando, enquanto a emissão com milhas geralmente não gera. Em resgates no limite, isso inverte o resultado.","Usar o preço de venda de milhas como referência e se convencer a 'lucrar': vender milhas viola o regulamento dos programas (etapa 7).","Achar que tabela fixa é sempre vantagem: se a passagem em dinheiro estiver em promoção, a tabela fixa pode sair mais cara."],"dica":"Conta com os números de exemplo da calculadora (mudam o tempo todo): passagem de R$ 1.500 ou 30.000 milhas + R$ 80 de taxas → (1.500 − 80) ÷ 30 = R$ 47,33 por milheiro. Com CPM de R$ 17,50, a passagem com milhas custa de verdade 30 × 17,50 + 80 = R$ 605, uma economia de R$ 895: use milhas. Agora uma dinâmica: R$ 400 ou 25.000 milhas + R$ 40 → (400 − 40) ÷ 25 = R$ 14,40 por milheiro, abaixo dos R$ 17,50 que as milhas custaram: pague em dinheiro. A calculadora só dá 'bom resgate' com folga de 15% acima do CPM (aqui, acima de R$ 20,13), para compensar regras de cancelamento e os pontos que você deixaria de ganhar pagando em dinheiro.","videos":[{"titulo":"Tarifa Award x Tarifa Comercial - Qual é a diferença?","canal":"Passageiro de Primeira","url":"https://www.youtube.com/watch?v=J648HLulLnY","publicado":"2026-07-22","duracao":"6:38","auditoria":{"nota":7,"risco":"Baixo","veredito":"Curto, recente e de um portal especializado sério: explica a diferença entre tarifa award (assento liberado para milhas, geralmente com preço fixo) e tarifa comercial (milhas atreladas ao preço em dinheiro), que é a base de 'tabela fixa x dinâmica'. Sem funil de venda na descrição. Auditado pela descrição; a legenda não estava acessível.","alerta":"O vídeo explica o conceito, não faz a conta. Depois de assistir, leve um exemplo real para a calculadora do site. 'Award' não é sinônimo de barato: compare sempre com o preço em dinheiro."}},{"titulo":"Milhas vs Dinheiro: qual a melhor escolha para emitir passagens aéreas baratas?","canal":"Pedro Gerador | Viagens sem perrengue","url":"https://www.youtube.com/watch?v=Fi_Oa5FssLo","publicado":"2026-10-16","duracao":"24:13","auditoria":{"nota":8,"risco":"Baixo","veredito":"Estudo de caso de outubro/2026: pesquisa o preço em dinheiro no Google Flights, compara com vários programas e monta um ranking. A planilha pública do vídeo usa a mesma lógica da calculadora do site, e conferimos as contas: no exemplo da GOL, 81.700 milhas a R$ 16 + R$ 35,15 = R$ 1.342,35 contra R$ 2.183 em dinheiro (39% de economia), e o milheiro máximo aceitável é (2.183 − 35,15) ÷ 81,7 = R$ 26,29. Auditado pela descrição, capítulos e planilha; a legenda não estava acessível.","alerta":"Os exemplos usam programas estrangeiros (AAdvantage, Flying Blue, TAP, Turkish), que são assunto da etapa 6: aqui, aprenda só o método. Os 'valores de milheiro' da planilha são referências de mercado e mudam. A descrição tem cupom de patrocinador de roupas, sem relação com o tema."}}],"calc":0},{"id":"taxas-e-custos","nome":"Taxas de embarque e custos escondidos","porque":"Passagem com milhas nunca é de graça: sempre há taxa de embarque e, dependendo do programa e da rota, outras cobranças. Em voos internacionais, algumas companhias somam uma sobretaxa de combustível que pode passar de mil reais e destruir a vantagem das milhas. Quem não soma todos os custos antes de emitir acha que economizou e, às vezes, pagou mais.","passos":["Na tela de resumo da emissão, separe o que é milha e o que é dinheiro: taxa de embarque (cobrada por aeroporto e trecho), taxa de emissão ou resgate do programa (quando houver) e, em internacional, a sobretaxa de combustível (às vezes chamada de YQ/YR ou 'taxas da companhia').","Em voo internacional, compare o mesmo voo em programas diferentes: a sobretaxa de combustível depende da companhia que opera e do programa que emite, e pode mudar muito de um para outro.","Some os opcionais que a tarifa não inclui: mala despachada, marcação de assento e, se for o caso, taxa por emitir pelo telefone ou balcão em vez de pelo site.","Coloque o total em dinheiro no campo 'Taxas pagas em dinheiro no resgate' da calculadora do site e refaça a conta do milheiro.","Desmarque produtos adicionados por padrão (seguro, assento, pacote) antes de pagar."],"armadilhas":["Olhar só o número de milhas e descobrir as taxas na última tela: em internacional, 'poucas milhas' com taxa alta pode sair pior do que pagar em dinheiro.","Esquecer que alguns programas cobram taxa de resgate ou de emissão, que pode variar com a antecedência, a categoria do cliente, o canal e se o titular viaja (a Azul, por exemplo, mudou essas regras mais de uma vez em 2025–2026). Confira na tela, não em vídeo antigo.","Pagar taxa de embarqu

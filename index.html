e em moeda estrangeira sem perceber: aí entram IOF e câmbio do cartão.","Atribuir às milhas custos que existiriam de qualquer jeito (IOF de gastos no exterior, taxa de hotel): na comparação entre milhas e dinheiro, só entra o que muda entre as duas opções."],"dica":"Exemplo fictício de internacional: passagem de R$ 3.500 em dinheiro ou 50.000 milhas + R$ 2.800 de taxas (com sobretaxa de combustível). Valor do milheiro: (3.500 − 2.800) ÷ 50 = R$ 14. Com milhas que custaram R$ 17,50 o milheiro, a emissão custa 50 × 17,50 + 2.800 = R$ 3.675, R$ 175 a mais que pagar em dinheiro. A mesma rota por um programa que não repassa a sobretaxa pode virar um ótimo resgate. A conta é sempre a mesma; o que muda é o total de taxas.","videos":[{"titulo":"Passagem com milhas vale a pena? A conta deu R$ 394 a mais","canal":"Letra Miúda","url":"https://www.youtube.com/watch?v=XTXzfo6u1uY","publicado":"2026-11-08","duracao":"7:49","auditoria":{"nota":6,"risco":"Baixo","veredito":"Dramatização curta, com personagens fictícios, que mostra como a viagem 'quase de graça' com milhas vai ganhando custos: bagagem, assento, seguro já marcado, IOF. A mensagem central está certa: some tudo antes de emitir. A descrição cita fontes (CDC sobre venda casada) e avisa que valores e regras são exemplos. Canal novo e de variedades, não especializado. Auditado pela descrição e capítulos; a legenda não estava acessível.","alerta":"Cuidado com a comparação do vídeo: IOF de gastos no exterior e taxa do hotel aconteceriam também pagando a passagem em dinheiro, e mala e assento só entram se a tarifa em dinheiro já os incluísse. Para decidir entre milhas e dinheiro, compare só o que muda entre as duas opções, com a mesma tarifa."}},{"titulo":"Cuidado: A \"Pegadinha\" das Taxas Absurdas nas Milhas","canal":"GuNasPraias","url":"https://www.youtube.com/watch?v=w0sLUuvmFvs","publicado":"2026-07-09","duracao":"11:08","auditoria":{"nota":6,"risco":"Médio","veredito":"Mostra na tela os dois vilões das taxas em internacional: a sobretaxa de combustível e a emissão 'em milhas' que esconde uma tarifa cara, com o exemplo de um mesmo voo da Emirates cuja taxa cai de cerca de R$ 4.200 para R$ 70 trocando o programa emissor. É o conteúdo certo para a aula. Perde pontos pelo funil no fim (assessoria VIP para quem gasta mais de R$ 30 mil por mês, clube pago e vários afiliados). Auditado pela descrição e capítulos; a legenda não estava acessível.","alerta":"A descrição diz que a sobretaxa de combustível seria 'ilegal no Brasil': o tema é controverso e, na prática, várias companhias cobram em emissões com milhas saindo do Brasil. Não conte com isso, confira o total na tela. Pule a partir de 9:34 (propaganda do clube e da assessoria)."}}]}]},{"tipo":"Antes e depois","aulas":[{"id":"alertas-de-promocao","nome":"Alertas e busca de promoções","porque":"Boa parte dos bons resgates é achada por quem pesquisa com calma e deixa alertas trabalhando, não por quem corre atrás de toda notificação. Ferramentas gratuitas avisam quando o preço em dinheiro cai e mostram onde há assento liberado para milhas. Ao mesmo tempo, grupos e posts com 'só hoje' e 'últimos assentos' vivem de urgência: saber pesquisar sozinho é o que protege você de emitir por impulso.","passos":["Crie um alerta de preço no Google Flights para a rota e o período que você quer: ele avisa por e-mail quando o preço em dinheiro muda e mostra se o preço atual está baixo, típico ou alto.","Para milhas, use um buscador de disponibilidade (ex.: Seats.aero, que tem plano gratuito limitado) e depois confirme sempre no site do programa antes de transferir ou emitir.","Se quiser alertas prontos, escolha um ou dois canais gratuitos de portais conhecidos (ex.: apps e grupos do Melhores Destinos, Passageiro de Primeira ou Pontos pra Voar) e silencie o resto.","Quando chegar um alerta, faça a conta do milheiro antes de qualquer coisa: preço em dinheiro da mesma data, milhas e taxas na calculadora do site.","Anote num lugar só (planilha ou bloco de notas) as rotas que você acompanha e os preços que achou; em poucas semanas você saberá reconhecer o que é promoção de verdade."],"armadilhas":["Transferir pontos ou comprar milhas porque o alerta disse 'corre' e só depois descobrir que o assento sumiu: confirme a disponibilidade no programa primeiro.","Pagar por grupo de alertas antes de saber usar as ferramentas gratuitas: o grupo pago não emite por você e não garante assento.","Clicar em link de 'promoção' que pede login ou dados: golpes usam exatamente o formato de alerta de passagem.","Confiar em dado antigo do buscador: disponibilidade de milhas aparece e some; olhe a data da última verificação."],"dica":"Regra das 24 horas contra a urgência artificial: se a oferta for boa e você não conseguir fazer a conta do milheiro em cinco minutos, espere. Promoções de transferência e de passagem se repetem várias vezes por ano; uma decisão errada de R$ 1.000 em milhas não se repete com desconto.","videos":[{"titulo":"Google Flights: como encontrar passagens baratas | Guia completo","canal":"Pedro Gerador | Viagens sem perrengue","url":"https://www.youtube.com/watch?v=lEeMIG3uakY","publicado":"2026-10-24","duracao":"30:35","auditoria":{"nota":8,"risco":"Baixo","veredito":"Guia recente e bem capitulado: filtros de bagagem e horário, como saber se a passagem está barata, datas flexíveis, criação de alertas de preço, 'Explorar' e extensões. A descrição já faz o alerta certo: comparar mesmos trechos e condições, somar taxas e confirmar disponibilidade no programa. Auditado pela descrição e capítulos; a legenda não estava acessível.","alerta":"O Google Flights é para pesquisar e acompanhar; compre ou emita no site oficial da companhia ou do programa. A extensão de milhas mostra preço por trecho e o Google pode mostrar ida e volta: confira antes de comparar."}},{"titulo":"Como Usar o Seats.aero 2026: Guia Completo do Básico ao Avançado","canal":"DIA23","url":"https://www.youtube.com/watch?v=MwSh1dVQj04","publicado":"2026-09-03","duracao":"26:04","auditoria":{"nota":7,"risco":"Médio","veredito":"Mostra o buscador de disponibilidade com milhas no plano gratuito e no pago, explica tarifa award, a importância do 'last seen' (quando a tarifa foi vista pela última vez) e como criar alertas. Declara não ter comissão da ferramenta e corrige um erro próprio na descrição, o que é raro. Perde pontos pelo funil de comunidade paga, curso e concierge. Auditado pela descrição detalhada e capítulos; a legenda não estava acessível.","alerta":"Comece pelo plano gratuito: a própria descrição diz que, se você resolve tudo em 60 dias, o pago não compensa. Os exemplos de executiva são da etapa 6. A conta da tabela fixa do vídeo usa milheiro de R$ 25–28, que é só um exemplo. Ignore os convites para comunidade e curso."}}]},{"id":"cancelamento-e-direitos","nome":"Cancelamento, remarcação e direitos","porque":"Plano muda, voo atrasa, companhia cancela. Quem emitiu com milhas tem os mesmos direitos básicos de quem pagou em dinheiro quando o problema é da companhia, mas muita gente aceita crédito, voucher ou perda de milhas por não saber disso. As regras da ANAC foram atualizadas em 26/10/2026 (Resolução 813, que altera a Resolução 400), então vídeos antigos podem estar desatualizados.","passos":["Se você desistir: veja na hora da emissão as regras de cancelamento e remarcação da tarifa e do programa. A ANAC garante desistência sem custo em até 24 horas após a compra, se ela foi feita com pelo menos 7 dias de antecedência do voo; confirme no programa como isso se aplica à emissão com milhas.","Se a companhia cancelar ou atrasar muito: você pode escolher, conforme o caso, entre reacomodação em outro voo, reembolso integral (milhas de volta e taxas em dinheiro) ou outro meio de transporte. Não é obrigado a aceitar crédito.","Durante a espera no aeroporto: a partir de 2 horas, a companhia deve dar alimentação; a partir de 4 horas, com necessidade de pernoite, hospedagem e transporte. Isso continua valendo mesmo com mau tempo. Guarde notas e comprovantes de tudo.","Se for impedido de embarcar por excesso de passageiros (overbooking), você tem direito às mesmas alternativas e a uma compensação prevista na Resolução 400; peça tudo por escrito.","Se não resolver: registre reclamação no ANAC Passageiro (plataforma oficial da ANAC) ou no consumidor.gov.br, com prints, localizador e comprovantes. Procon e Juizado Especial Cível são os próximos passos."],"armadilhas":["Aceitar 'crédito', voucher ou devolução parcial de milhas quando o cancelamento foi da companhia: o reembolso integral é direito seu, inclusive em passagem emitida com milhas.","Cancelar por conta própria uma emissão com milhas achando que tudo volta: em desistência voluntária, os programas podem cobrar taxa ou reter milhas, e a vaga de beneficiário pode continuar ocupada.","Acreditar em promessa de 'indenização garantida' por atraso: dano moral depende de prova e de decisão judicial, e o tema está em discussão no STF. Desconfie de quem cobra caro para 'garantir' indenização.","Confiar em vídeos anteriores a 26/10/2026: a assistência de comunicação após 1 hora de espera foi retirada e o dever de informação mudou."],"dica":"Exemplo fictício: você emitiu 20.000 milhas + R$ 60 de taxas e a companhia cancelou o voo. Se escolher reembolso, o correto é receber as 20.000 milhas de volta na conta e os R$ 60 em dinheiro, sem multa. Se a desistência for sua, fora das 24 horas, vale a regra do programa, que pode cobrar uma taxa ou reter parte das milhas. Por isso, antes de emitir uma viagem incerta, leia a regra de cancelamento: ela também é custo.","videos":[{"titulo":"Novas regras da Anac: o que muda no seu voo atrasado a partir de 26/10","canal":"Agora no Mundo","url":"https://www.youtube.com/watch?v=rTvar0WiB3g","publicado":"2026-10-24","duracao":"5:23","auditoria":{"nota":7,"risco":"Baixo","veredito":"Resumo curto e atual da Resolução 813/2026, que altera a 400: mantém alimentação após 2 horas e hotel com transporte após 4 horas com pernoite (inclusive com mau tempo), retira a assistência de comunicação após 1 hora, amplia o dever de informar e cria o reembolso de despesas em situações excepcionais. Bate com o que a ANAC e a imprensa publicaram, e a descrição lista as fontes. Canal de notícias pequeno, com narração sintética e ilustrações. Auditado pela descrição e capítulos; a legenda não estava acessível.","alerta":"O vídeo não fala de passagem emitida com milhas nem de desistência voluntária. Complete com esta aula: em cancelamento pela companhia, os direitos valem igual para milhas. O reembolso em 7 dias citado é o das despesas que você pagou do bolso em situação excepcional, com comprovantes."}},{"titulo":"Como reclamar e receber resposta das aéreas em 10 dias","canal":"Melhores Destinos","url":"https://www.youtube.com/watch?v=jt73ULLz8HM","publicado":"2026-08-10","duracao":"9:24","auditoria":{"nota":8,"risco":"Baixo","veredito":"Passo a passo do ANAC Passageiro, a plataforma gratuita e oficial de reclamação contra companhias aéreas, com documentos para anexar, prazo de resposta e comparação com o consumidor.gov.br. É o canal certo, sem intermediário pago. Auditado pela descrição e capítulos; a legenda não estava acessível.","alerta":"Problema com o programa de fidelidade (milhas não devolvidas, taxa de cancelamento) pode precisar ser reclamado contra o programa, e não só contra a companhia aérea. Ignore os links de seguro viagem com desconto da descrição."}}]}]}],"materiais":[{"titulo":"Novas regras da ANAC para atrasos e cancelamentos","descricao":"Agência Gov · Resolução 813/2026, em vigor desde 26/10/2026","url":"https://agenciagov.ebc.com.br/noticias/202609/anac-atualiza-regras-sobre-atrasos-e-cancelamentos-e-amplia-deveres-de-informacao-aos-passageiros"},{"titulo":"Reclamar de companhia aérea","descricao":"consumidor.gov.br · canal oficial, gratuito","url":"https://www.consumidor.gov.br/"}]},{"modulo":5,"nivel":"Intermediário","titulo":"Além da passagem","resumo":"Outros usos para pontos e benefícios de cartão: sala VIP, hotel, carro, seguros. E os resgates que parecem bons mas destroem valor.","grupos":[{"tipo":"Usar bem","aulas":[{"id":"salas-vip","nome":"Salas VIP","porque":"Sala VIP é o benefício mais visível e o argumento mais usado para vender cartão de anuidade alta. Entre 2024 e 2026 os bancos cortaram visitas, trocaram de programa e passaram a exigir gasto mínimo para manter o acesso. Entender quem paga essa conta evita gastar mais de mil reais por ano em anuidade para tomar alguns cafés no aeroporto.","passos":["No app do banco ou no site da bandeira, descubra qual programa o seu cartão dá (LoungeKey, Priority Pass, DragonPass/Visa Airport Companion, Mastercard Airport Experiences ou sala própria do banco) e anote as regras: visitas por ano, se exige gasto mínimo e se o convidado paga.","Ative o benefício antes de viajar (app ou cartão digital do programa) e confira quais salas existem nos aeroportos e terminais que você usa de verdade, separando voo doméstico de internacional.","Pergunte ao banco quanto custa a visita extra e a do acompanhante: em geral a cobrança vem na fatura em dólar, com IOF.","Faça a conta: anuidade efetivamente paga ÷ visitas que você realmente usa no ano = custo por visita. Compare com o que gastaria comendo no aeroporto.","No dia, leve o cartão (físico ou no app) e o cartão de embarque, e respeite o limite de tempo antes do voo que a sala aplicar."],"armadilhas":["Pagar anuidade alta só pela sala VIP e usar duas ou três vezes por ano.","Levar acompanhante achando que é grátis: a visita do convidado costuma ser cobrada em dólar na fatura, e o valor por visita muda conforme o programa.","Gastar mais do que o normal para bater o gasto mínimo trimestral que alguns bancos passaram a exigir para manter o acesso.","Confiar em regra antiga: bancos trocam de programa e cortam visitas com pouco aviso, e a sala pode recusar a entrada por lotação."],"dica":"Conta com números fictícios: anuidade de R$ 1.200 e 6 visitas usadas no ano → R$ 1.200 ÷ 6 = R$ 200 por visita. Se um lanche no aeroporto sai por R$ 60, a sala sozinha não paga essa anuidade. A conta só fecha se a anuidade for isenta por um gasto que você já faz, ou se você viaja muito. Refaça com os seus números antes de pedir ou manter um cartão por causa de sala VIP.","videos":[{"titulo":"SALAS VIP: como acessar e o que é Loungekey, Priority Pass e Dragon Pass?","canal":"Melhores Destinos","url":"https://www.youtube.com/watch?v=08hytGgXdV4","publicado":"2026-06-13","duracao":"17:23","auditoria":{"nota":8,"risco":"Baixo","veredito":"Explicação clara e recente das diferenças entre LoungeKey, Priority Pass e Dragon Pass e de como descobrir qual o seu cartão oferece, com links para os sites oficiais dos programas. A monetização se limita ao ranking de cartões e aos apps do próprio canal. Auditado pela descrição; a transcrição não estava acessível.","alerta":"A descrição promete acesso 'sem pagar nada a mais', mas quem paga é a anuidade ou o gasto mínimo exigido pelo banco. Várias regras de bancos mudaram depois da gravação (junho/2026): confirme no seu banco."}},{"titulo":"Melhores Cartões para Sala VIP 2026: Loungekey, Priority Pass e Dragon Pass","canal":"DIA23","url":"https://www.youtube.com/watch?v=uZJBr1LLksc","publicado":"2026-08-24","duracao":"19:25","auditoria":{"nota":7,"risco":"Médio","veredito":"Atualizado (agosto/2026) e com a mensagem certa: em 2026 quase todo banco passou a exigir gasto mínimo, e o que decide é o seu gasto real, não só a anuidade. Mostra a linha do tempo dos cortes, banco por banco. A descrição tem funil para curso, comunidade paga, concierge e cupons de afiliado. Auditado pela descrição detalhada e pelos capítulos; a transcrição não estava acessível.","alerta":"A lista de cartões, anuidades e gastos mínimos é de agosto/2026 e envelhece rápido: confira no banco antes de decidir. Não peça um cartão de alta renda só pela sala VIP; some anuidade e gasto mínimo e compare com o uso que você faria."}}]},{"id":"hoteis-e-carros","nome":"Hotéis e carros com pontos","porque":"Livelo, Esfera e as companhias aéreas oferecem diárias de hotel e aluguel de carro, e a vitrine faz parecer um bom negócio. Muitas vezes, porém, o ponto rende menos ali do que numa passagem. Programas de hotel como o ALL Accor funcionam de outro jeito (o ponto tem valor fixo de desconto). Saber comparar o milheiro evita queimar pontos que valeriam mais em outro uso.","passos":["Antes de resgatar, cote a mesma diária ou o mesmo aluguel em dinheiro, nas mesmas datas, com a mesma categoria e a mesma política de cancelamento, no site do hotel ou da locadora e num buscador.","Calcule o valor do milheiro: (preço em dinheiro − o que você paga em dinheiro no resgate) ÷ pontos usados × 1.000.","Compare esse valor com o que você costuma conseguir em passagens (etapa 4) e com a opção de transferir para um programa de hotel, que às vezes tem promoção bonificada. Faça a conta em todas as opções.","Leia o que está incluso: taxas locais e café da manhã no hotel; no carro, proteções, franquia, taxas de devolução e o bloqueio de caução no cartão de crédito.","Cadastre-se grátis nos programas da rede ou da locadora que você usa (ex.: ALL Accor, Marriott Bonvoy, Hilton Honors, IHG One Rewards, programas de locadoras) para acumular nas estadias pagas, sem estocar pontos sem plano."],"armadilhas":["Comparar o resgate com o preço cheio de balcão, e não com o menor preço real que você pagaria em dinheiro.","Não ler a política de cancelamento: reservas com pontos costumam ter regras mais duras, e reservas feitas por terceiros (banco ou companhia) muitas vezes não dão pontos nem noites de status no programa do hotel.","No carro, descobrir no balcão que a diária com pontos não incluía proteções e taxas, ou ter o limite do cartão travado pela caução.","Transferir milhas aéreas para programa de hotel sem fazer a conta: a paridade costuma ser ruim fora de promoção."],"dica":"Exemplo com números fictícios: diária de R$ 600 ou 40.000 pontos Livelo → 600 ÷ 40.000 × 1.000 = R$ 15 por milheiro. Se nas passagens você costuma conseguir R$ 25 por milheiro, os mesmos 40.000 pontos valeriam R$ 1.000 numa passagem, e o hotel com pontos 'custou' R$ 400 de valor perdido. A conta muda se você não tem viagem aérea em vista ou se os pontos estão para vencer.","videos":[{"titulo":"Vale a pena usar PONTOS e MILHAS pra se HOSPEDAR? | Análise COMPLETA para os Principais Programas!","canal":"Universo das Milhas","url":"https://www.youtube.com/watch?v=-dvaA1qKvFU","publicado":"2025-02-05","duracao":"21:23","auditoria":{"nota":7,"risco":"Médio","veredito":"Faz a pergunta certa (vale a pena hospedar com pontos?) e passa programa por programa (Livelo, Smiles, LATAM Pass, Azul Fidelidade e ALL Accor), comparando com o preço em dinheiro. Tem quase 2 anos, e as tabelas mudaram desde então. O canal vende curso e um 'Balcão de Milhas' (venda de milhas). Auditado por título, descrição e capítulos; a transcrição não estava acessível.","alerta":"Aproveite o método, não os números: refaça a conta com os preços de hoje. Se o vídeo comparar com 'quanto o mercado paga pelo milheiro', esse é o preço de venda de milhas, que os regulamentos proíbem. Compare com o que você consegue em passagens e ignore o balcão."}},{"titulo":"GASTEI MEUS PONTOS LIVELO PARA ALUGAR UM CARRO… FOI UM BOM NEGÓCIO?","canal":"Everton Rufino","url":"https://www.youtube.com/watch?v=CPbwILWNbDc","publicado":"2026-08-12","duracao":"11:50","auditoria":{"nota":6,"risco":"Baixo","veredito":"Teste real e recente de aluguel de carro com pontos Livelo: mostra o preço em dinheiro, os pontos usados e quanto cada ponto valeu, no formato honesto de 'fiz e mostro a conta'. O canal é pequeno e sem histórico no nicho, e é um caso só (uma data, um lugar, uma locadora). Auditado pela descrição; a transcrição não estava acessível.","alerta":"O resultado vale para aquela reserva; refaça a conta com as suas datas. Preste atenção na parte dos 'detalhes que eu não esperava': proteções, taxas e caução no cartão podem mudar a conta."}}]},{"id":"beneficios-do-cartao","nome":"Benefícios do cartão: seguros e proteção","porque":"Cartões de categoria mais alta costumam trazer seguros da bandeira (Visa ou Mastercard): seguro viagem, compra protegida, garantia estendida. Em alguns casos valem mais que os pontos. Só funcionam se você cumprir as condições, como pagar a passagem com o cartão e emitir o bilhete antes de viajar, e se souber que muitos funcionam por reembolso. Conhecer coberturas e exclusões antes evita uma surpresa cara no exterior.","passos":["Descubra a bandeira e a categoria exata do seu cartão (no app ou na fatura) e consulte, no portal de benefícios da bandeira, o que essa categoria oferece.","Antes de uma viagem internacional, cumpra a condição de elegibilidade (em geral pagar a passagem, ou as taxas do resgate com milhas, com o cartão; confira a regra atual) e emita o bilhete ou certificado no site da bandeira. Guarde o PDF e os telefones da assistência.","Leia as condições gerais: limite de despesas médicas, exclusões (doença preexistente, esportes, gravidez etc.), se o atendimento é direto ou por reembolso e se o documento atende a exigências do destino.","Para compra protegida e garantia estendida: guarde nota fiscal, fatura e termo de garantia do fabricante, e anote o prazo para abrir o pedido.","Compare com o preço de um seguro viagem pago para o seu perfil (idade, destino, saúde) antes de decidir viajar só com o do cartão."],"armadilhas":["Achar que o seguro vale automaticamente: sem pagar com o cartão e sem bilhete emitido, a cobertura pode não existir.","Descobrir no exterior que o seguro é por reembolso: você paga o hospital do próprio bolso (ou no limite do cartão) e espera o ressarcimento.","Ignorar exclusões e limites, como doença preexistente, atividades de aventura e valores baixos para bagagem.","Manter um cartão de anuidade alta 'pelos seguros' sem nunca ter lido as condições: bandeira e banco podem mudar ou retirar benefícios."],"dica":"Pense no pior cenário, não no médio. Pergunte: 'se eu precisar de um hospital no exterior, tenho dinheiro ou limite para adiantar a conta enquanto espero o reembolso?' e 'o limite de despesas médicas da minha categoria cobre o destino?'. Se a resposta for não, ou se você tem condição preexistente, um seguro pago pode valer o custo, mesmo tendo o do cartão.","videos":[{"titulo":"Seguro Viagem da Visa mudou - Veja como emitir o bilhete agora.","canal":"Passageiro de Primeira","url":"https://www.youtube.com/watch?v=siGtze2Dd1M","publicado":"2026-09-16","duracao":"12:39","auditoria":{"nota":8,"risco":"Baixo","veredito":"Atualizado (setembro/2026): mostra as duas formas atuais de emitir o bilhete do seguro Visa (só o certificado, ou validar a viagem antes) e os documentos de cada caso, apontando o site oficial de benefícios. Sem funil de venda. Auditado pela descrição; a transcrição não estava acessível.","alerta":"Vale para cartões Visa, e a cobertura depende da categoria do seu cartão. Se o seu for Mastercard, o mesmo canal tem o vídeo equivalente: https://www.youtube.com/watch?v=J9WWw-xFhvI. Emitir o bilhete não substitui ler as exclusões."}},{"titulo":"SEGURO-VIAGEM do CARTÃO de crédito: o que NINGUÉM te conta (e me deixou na mão na hora H)!","canal":"Imagina na Viagem","url":"https://www.youtube.com/watch?v=TZ80yGUL0eQ","publicado":"2026-06-14","duracao":"13:53","auditoria":{"nota":7,"risco":"Médio","veredito":"Cobre o que os tutoriais costumam pular: reembolso x assistência direta, regra da bandeira x da seguradora, exclusões, prazos e categoria do cartão, com casos reais (Bariloche e Paris). O viés está no fim: recomenda seguro pago por link de afiliado com cupom. Auditado pela descrição e pelos capítulos; a transcrição não estava acessível.","alerta":"Os alertas valem; a conclusão de 'nunca viajar sem seguro especializado' vem de quem ganha comissão do comparador. Decida pelos limites e exclusões da sua categoria, não pelo susto."}}]},{"id":"produtos-e-cashback","nome":"Troca por produtos e cashback","porque":"A vitrine de produtos do programa é o jeito mais fácil, e quase sempre o pior, de usar pontos: a conta do milheiro costuma mostrar que o ponto vale bem menos numa geladeira do que numa passagem, e às vezes menos até que no cashback. Saber fazer essa conta em um minuto protege o que você acumulou. Também é educação financeira reconhecer quando o dinheiro de volta é a melhor saída, por exemplo com pontos vencendo e nenhuma viagem à vista.","passos":["Escolha um produto do catálogo, anote quantos pontos ele pede e procure o mesmo produto em dinheiro, pelo menor preço real (com frete).","Calcule: preço em dinheiro ÷ pontos × 1.000 = valor do milheiro nesse resgate. Faça o mesmo para a opção de cashback ou desconto na fatura do seu programa.","Compare esses valores com o que você consegue em passagens (use a calculadora da trilha).","Se não há viagem à vista e os pontos vão vencer, escolha a opção com mais reais por milheiro entre cashback, fatura e produto: perder os pontos é o pior caso.","Se você sempre acaba trocando pontos por dinheiro, considere um cartão de cashback direto (etapa 2): costuma render mais do que converter pontos."],"armadilhas":["Olhar só o 'preço em pontos' sem comparar com o preço do produto em outras lojas: catálogos costumam usar preço cheio.","Usar 'pontos + dinheiro' em produto sem ver que a parte em dinheiro já pode estar acima do preço de mercado.","Resgatar algo que você não compraria só para 'não perder' pontos: isso não é economia.","Usar o preço de venda de milhas como régua: vender é proibido pelos regulamentos e tem risco de bloqueio e de calote."],"dica":"Exemplo com números fictícios: geladeira por 250.000 pontos, que custa R$ 3.000 no varejo → 3.000 ÷ 250.000 × 1.000 = R$ 12 por milheiro. Se o seu programa paga cashback a R$ 15 por milheiro, os mesmos 250.000 pontos virariam R$ 3.750 em dinheiro, mais que o preço da geladeira. E se você consegue R$ 25 por milheiro em passagens, eles valeriam R$ 6.250 numa viagem.","videos":[{"titulo":"Vale a Pena Trocar Pontos por Produtos? Fiz as Contas!","canal":"Vivi por aí - Milhas","url":"https://www.youtube.com/watch?v=-b95uRda9i0","publicado":"2026-10-25","duracao":"20:42","auditoria":{"nota":8,"risco":"Baixo","veredito":"Exatamente o tema da aula e muito recente (outubro/2026): pega uma geladeira na Livelo e compara o preço em pontos, o preço em dinheiro na própria Livelo e em outras lojas, e o valor dos pontos usados. Não demoniza toda troca; ensina a avaliar cada uma. A única divulgação é um grupo de WhatsApp. Auditado pela descrição; a transcrição não estava acessível.","alerta":"O milheiro Livelo de R$ 25 usado como referência é um parâmetro do canal, não um valor oficial. Use o valor que você realmente consegue nos seus resgates, nunca o preço de venda de milhas."}},{"titulo":"Por que você NUNCA deve trocar PONTOS e MILHAS por desconto na FATURA | Mostrei como ganhar mais!","canal":"Universo das Milhas","url":"https://www.youtube.com/watch?v=szCUVNCRvdk","publicado":"2025-06-26","duracao":"11:43","auditoria":{"nota":6,"risco":"Médio","veredito":"Mostra por que desconto na fatura e cashback com pontos costumam render pouco e chega a uma conclusão útil: quem quer dinheiro de volta costuma ganhar mais com um cartão de cashback do que convertendo pontos. Perde nota pelo 'NUNCA' absoluto e porque o canal vende um 'Balcão de Milhas' (venda). Auditado pela descrição; a transcrição não estava acessível.","alerta":"'Nunca' é exagero: com pontos perto de vencer e sem viagem à vista, cashback é melhor que perder tudo. Se o vídeo sugerir vender os pontos como alternativa, desconsidere: os regulamentos proíbem e há risco de bloqueio."}}]}]}],"materiais":[]},{"modulo":6,"nivel":"Avançado","titulo":"Voar mais longe","resumo":"Voos internacionais com milhas: companhias parceiras, paradas no caminho, programas de fora do Brasil e a executiva sem ilusão.","grupos":[{"tipo":"Internacional","aulas":[{"id":"aliancas-e-parceiras","nome":"Alianças e companhias parceiras","porque":"Para fora do Brasil, quase nunca você voa na companhia dona do seu programa. LATAM, GOL e Azul não fazem parte de nenhuma das três grandes alianças (Star Alliance, oneworld e SkyTeam): cada programa tem a sua própria lista de parceiras. Saber quem emite em quem é o que transforma milhas nacionais num voo para a Europa, os EUA ou a Ásia, e evita transferir pontos para um programa que não emite na rota que você quer.","passos":["Comece pela rota, não pelo programa: no Google Flights, veja quais companhias voam do Brasil (ou de um hub próximo) até o seu destino.","Descubra a aliança de cada uma dessas companhias e, principalmente, quais programas que você consegue alimentar emitem nelas: abra a página de companhias parceiras de Smiles, LATAM Pass e Azul Fidelidade e anote a data da consulta.","Procure assento em tarifa-prêmio (award) da parceira no site do próprio programa e, se quiser, cruze com buscadores como o seats.aero ou com o site de outra companhia da mesma aliança (ex.: United para a Star Alliance).","Compare o mesmo voo em dois ou mais programas: milhas + taxas, tudo convertido em reais. Só então decida para onde transferir os pontos do banco.","Se o voo da parceira não aparece no site, confirme com a central do programa se a emissão é feita por telefone ou WhatsApp antes de transferir qualquer ponto."],"armadilhas":["Achar que a aliança basta: o que vale é o acordo entre o seu programa e aquela companhia. Ser parceira de uma companhia da aliança não dá acesso automático a todas as outras.","Transferir pontos antes de confirmar o assento na data: a transferência é de mão única e a disponibilidade em parceira some rápido.","Confundir tarifa-prêmio (award) com tarifa comercial vendida em milhas: a comercial acompanha o preço em dinheiro e costuma custar bem mais milhas.","Ignorar as taxas: em parceiras internacionais, taxas de embarque e eventuais sobretaxas podem somar centenas ou até milhares de reais, conforme a companhia e o programa."],"dica":"Ache o voo primeiro e só depois escolha o programa. Exemplo com números fictícios para o mesmo assento: Programa A cobra 80.000 milhas + R$ 600; Programa B cobra 60.000 milhas + R$ 1.800. Se o milheiro do A te custa R$ 25 e o do B R$ 30: A = 80 × 25 + 600 = R$ 2.600; B = 60 × 30 + 1.800 = R$ 3.600. Menos milhas não quer dizer mais barato: as taxas mudaram o resultado.","videos":[{"titulo":"MILHAS para INICIANTES: ALIANÇAS e PARCERIAS","canal":"Matteo Sabatini | Embarque Prioritário","url":"https://www.youtube.com/watch?v=UNS_mwBCdtc","publicado":"2026-01-06","duracao":"12:49","auditoria":{"nota":7,"risco":"Baixo","veredito":"Introdução curta e bem dividida: o que é uma aliança, quais são as três, como funcionam as parcerias, um exemplo de como descobrir qual companhia voa para um país, status e resgate. Sem promessa de lucro. Auditado pela descrição e capítulos.","alerta":"O trecho sobre status (milhas qualificáveis) é secundário para esta aula. O que importa: as companhias brasileiras não estão em alianças, então vale a lista de parceiras de cada programa, que muda. A descrição divulga roteiros pagos e e-books do autor; não precisa de nada disso."}},{"titulo":"OneWorld, StarAlliance, SkyTeam | Qual oferece os melhores voos? Mas e Azul, Gol e Latam?","canal":"Pedro Gerador | Viagens sem perrengue","url":"https://www.youtube.com/watch?v=USmhsq1273A","publicado":"2026-05-17","duracao":"37:23","auditoria":{"nota":7,"risco":"Baixo","veredito":"Vai além do conceito: cobre as três alianças, as parcerias das companhias brasileiras e uma busca prática com Google Flights, seats.aero e uma planilha de apoio. É o 'como buscar parceiras' que falta no primeiro vídeo, mas é longo. Auditado pela descrição; sem capítulos nem transcrição acessível.","alerta":"O seats.aero mostra disponibilidade de uma consulta anterior e parte dos recursos é paga: confirme sempre no site do programa antes de transferir pontos. A descrição traz o link da agência de viagens do autor e vídeos sobre compra de milhas (assunto da etapa 3)."}}]},{"id":"stopover-e-multidestinos","nome":"Stopover e multidestinos","porque":"Uma parada planejada numa cidade do caminho pode transformar uma viagem em duas, às vezes sem mudar o preço da passagem. Mas as regras variam muito: algumas companhias e programas permitem stopover em emissão com milhas, outros só em passagem paga, e vários cobram por isso. Entender a diferença entre escala, conexão, stopover e open jaw evita pagar mais achando que está economizando.","passos":["Aprenda os termos: escala (o avião pousa e segue, em geral no mesmo voo), conexão (troca de avião dentro do prazo da regra, normalmente até 24 horas em voo internacional), stopover (parada mais longa e planejada, no mesmo bilhete) e open jaw (chega por uma cidade e volta por outra).","Veja quais cidades são hub das companhias que voam a sua rota (ex.: Lisboa para a TAP, Cidade do Panamá para a Copa, Doha para a Qatar) e se o programa em que estão as suas milhas permite parada naquela emissão.","Leia a regra atual do programa ou da companhia: quantas paradas, por quantos dias, se cobra milhas ou taxa extra e se o pedido é feito no site ou só pela central.","Monte três alternativas e compare o custo total em reais: bilhete com stopover, trechos só de ida emitidos separadamente (multidestinos) e bilhete direto mais um voo barato entre as cidades.","Some os custos da cidade extra (hotel, transporte, alimentação) e confira exigências de entrada do país da parada."],"armadilhas":["Achar que 'stopover grátis' é viagem grátis: a passagem pode não mudar, mas hotel, transporte e dias de férias custam.","Supor que a regra da passagem paga vale para milhas: muitos programas não permitem stopover em emissão com milhas, ou cobram à parte.","Emitir trechos separados sem margem de tempo: se um voo atrasa, a companhia do bilhete seguinte não tem obrigação de reacomodar você, e a bagagem não segue despachada até o fim.","Esquecer visto, seguro ou autorização eletrônica de entrada exigidos no país da parada, mesmo para poucos dias."],"dica":"Antes de comemorar o stopover, faça a conta das três opções. Exemplo com números fictícios e milheiro a R$ 20: (1) bilhete com parada: 70.000 milhas + R$ 900 = 70 × 20 + 900 = R$ 2.300; (2) dois trechos separados: 75.000 milhas + R$ 1.000 = R$ 2.500; (3) bilhete direto + voo entre as cidades: 60.000 milhas + R$ 800 + R$ 400 = R$ 2.400. A opção com parada venceu por pouco, e em todas falta somar o hotel da cidade extra.","videos":[{"titulo":"Compre 1 passagem, viaje para 2 países com stopover - veja como!","canal":"Melhores Destinos","url":"https://www.youtube.com/watch?v=2SZHzTH2A4E","publicado":"2026-07-22","duracao":"17:22","auditoria":{"nota":8,"risco":"Baixo","veredito":"Didático e recente: o que é stopover, a diferença entre escala, conexão e stopover, o papel do hub, companhias que oferecem parada sem custo de passagem, passo a passo da compra e cinco cuidados antes de reservar. Auditado pela descrição e capítulos.","alerta":"O foco é passagem paga. Com milhas, a regra depende do programa: muitos não permitem parada, e a saída é emitir trechos separados (multidestinos), com o risco de bilhetes sem proteção entre si. 'Grátis' vale só para a passagem: hotel e transporte na cidade extra são por sua conta."}},{"titulo":"Stopover LATAM: regras e como solicitar","canal":"Melhores Destinos","url":"https://www.youtube.com/watch?v=6ao_efqJvzs","publicado":"2026-07-01","duracao":"7:33","auditoria":{"nota":7,"risco":"Baixo","veredito":"Curto e objetivo sobre o programa de stopover de uma companhia: cidades, tempo de permanência, como pedir (não é pelo site), custos, bagagem e se dá para usar LATAM Pass. Bom exemplo de regulamento real para ler antes de montar o roteiro. Auditado pela descrição e capítulos.","alerta":"São regras de uma única companhia, vigentes em jul/2026. Confirme no site da LATAM antes de planejar. Como o pedido é feito pelo atendimento, guarde o protocolo e confira no bilhete as duas datas e a bagagem."}}]},{"id":"programas-estrangeiros","nome":"Programas estrangeiros","porque":"Programas de fora, como TAP Miles&Go, Avios (Iberia, British Airways, Qatar), Flying Blue (Air France-KLM) e AAdvantage (American Airlines), às vezes cobram menos milhas em voos internacionais e alcançam companhias que os nacionais não alcançam. Em troca, você assume taxas em moeda estrangeira, regras em outro idioma, atendimento fora do Brasil e mudanças sem aviso. É uma ferramenta para uma viagem específica, não um lugar para guardar pontos.","passos":["Comece pela viagem (rota, datas, cabine) e só depois veja se algum programa estrangeiro cobra menos, em milhas + taxas, que os nacionais para aquele voo.","Confira se o seu programa de banco transfere para ele e com qual paridade hoje (Livelo e Esfera têm parcerias com alguns programas estrangeiros; o AAdvantage acumula, por exemplo, pelo cartão co-branded do Santander). Isso muda com frequência.","Crie a conta no programa com antecedência, com o nome exatamente igual ao do passaporte, e ative a verificação em duas etapas.","Simule a emissão até a tela de pagamento para ver as taxas reais em euro, libra ou dólar; converta para reais somando IOF e spread do cartão.","Só transfira os pontos com o assento confirmado e emita logo em seguida. Não deixe saldo parado num programa estrangeiro."],"armadilhas":["Olhar só a quantidade de milhas: algumas companhias cobram sobretaxa de combustível alta em emissões com milhas (a British Airways em voos próprios é o exemplo clássico), e a 'emissão barata' fica mais cara que a nacional.","Esquecer o câmbio: as taxas são cobradas em moeda estrangeira no cartão, com IOF e spread, e o valor final só aparece na fatura.","Regras e atendimento em outro idioma: cancelamento, remarcação, no-show e validade seguem o regulamento de lá, e a central pode não atender em português.","Achar que programa estrangeiro não desvaloriza: tabelas e parcerias mudam lá fora também (a TAP Miles&Go, por exemplo, passou por mudanças em 2026)."],"dica":"Converta tudo para reais antes de decidir. Exemplo com números fictícios: 40.000 Avios + € 350 de taxas contra 60.000 milhas nacionais + R$ 500. Com o euro a R$ 6,20 e IOF de 3,5%: 350 × 6,20 = R$ 2.170, × 1,035 ≈ R$ 2.246 de taxas. Com Avios a R$ 30 o milheiro, o total é 40 × 30 + 2.246 ≈ R$ 3.446. Com milhas nacionais a R$ 25: 60 × 25 + 500 = R$ 2.000. A opção com 'menos milhas' saiu R$ 1.446 mais cara.","videos":[{"titulo":"Ávios - Internacionalização das milhas é pra todo mundo ou só moda?","canal":"Milhas com Matheus","url":"https://www.youtube.com/watch?v=-ucRgyuhReI","publicado":"2026-07-07","duracao":"17:59","auditoria":{"nota":6,"risco":"Médio","veredito":"Faz a pergunta certa antes de mover pontos para fora: a corrida para os Avios serve para o seu perfil ou é moda? Recente e com viés crítico, o que é raro no tema. Auditado só por título e descrição (sem capítulos nem transcrição acessível): confiança menor.","alerta":"A descrição é cheia de afiliados (seats.aero Pro, Revolut, Nomad, Wise) e oferece consultoria e serviço de 'internacionalização' de patrimônio. Nada disso é necessário para usar um programa estrangeiro. Transferência é de mão única e as taxas são em moeda estrangeira, com IOF."}},{"titulo":"Como Funcionam os AVIOS? Guia Prático para Iberia, Qatar e British","canal":"Melhores Destinos","url":"https://www.youtube.com/watch?v=WR4ejX6FXXY","publicado":"2026-05-28","duracao":"1:16:41","auditoria":{"nota":7,"risco":"Baixo","veredito":"Live de fonte séria que explica os Avios na prática: Iberia Plus como porta de entrada para brasileiros e a movimentação do saldo entre Iberia, British, Qatar e Finnair. Longa e no formato de live. Auditado pela descrição; sem capítulos nem transcrição acessível.","alerta":"Cobre só os Avios: TAP, Flying Blue e AAdvantage ficam de fora. Bônus, tabelas e taxas citados são de mai/2026. Antes de transferir, simule a emissão e veja as taxas em euro ou libra, que variam muito conforme a companhia operadora. A descrição traz link de indicação da Revolut."}}]},{"id":"executiva-com-milhas","nome":"Executiva com milhas","porque":"Executiva em voo longo é onde as milhas costumam render mais valor e também onde há mais ilusão. Os assentos-prêmio em executiva são poucos por voo, disputados e cada vez mais com preço dinâmico. Quem consegue costuma ter datas flexíveis, sair de um hub, viajar com poucas pessoas e ter os pontos prontos para transferir na hora.","passos":["Defina o que é aceitável: datas com margem de alguns dias, cidades de saída possíveis, número de passageiros (cada pessoa a mais reduz muito as chances) e se executiva só no trecho longo já basta.","Pesquise disponibilidade em vários programas e em buscadores de tarifa-prêmio, em datas próximas, antes de transferir qualquer ponto. Os assentos costumam aparecer quando a agenda abre, quase um ano antes, ou perto da data do voo.","Anote o custo total: milhas × o seu custo do milheiro + taxas em reais.","Compare com o que você realmente pagaria: a econômica paga na mesma data e, se houver, uma executiva em promoção. Decida pela diferença em reais.","Com o assento confirmado, transfira e emita no mesmo dia: disponibilidade em executiva some em horas."],"armadilhas":["Acreditar em prints de 'executiva só com taxas': o print esconde as milhas, que custaram dinheiro (anuidade, clube, compra de pontos) ou poderiam pagar outra viagem.","Calcular a 'economia' sobre a tarifa cheia da executiva: se você nunca pagaria R$ 20 mil, essa não é a sua economia.","Comprar milhas antes de achar o assento: sem disponibilidade, você fica com milhas caras paradas num programa que pode desvalorizar.","Travar a viagem num único dia ou buscar quatro assentos juntos: achar vários lugares em executiva no mesmo voo é raro."],"dica":"Compare com o que você pagaria de verdade. Exemplo com números fictícios: executiva só de ida para a Europa por 120.000 milhas + R$ 1.400 de taxas. Com milheiro a R$ 18, o custo real é 120 × 18 + 1.400 = R$ 3.560. Se a econômica paga no mesmo dia custa R$ 2.800, você paga R$ 760 a mais pelo conforto, o que pode valer a pena num voo noturno de 10 horas. Mas não diga que 'economizou R$ 14.440' porque a executiva custava R$ 18.000 em dinheiro: você não pagaria esse valor.","videos":[{"titulo":"Verdades sobre a classe executiva que ninguém te conta!","canal":"Ju | Milhas e Viagens","url":"https://www.youtube.com/watch?v=Jtth7yFLPII","publicado":"2026-09-29","duracao":"5:58","auditoria":{"nota":7,"risco":"Baixo","veredito":"Curto, recente e honesto: mostra que não basta juntar milhas e escolher o voo, que nem toda executiva vale a pena (ex.: gastar milhas num voo curto em vez de um longo noturno) e que o ponto de partida é o planejamento. Auditado pela descrição; sem capítulos nem transcrição acessível.","alerta":"O exemplo da Qsuite a cerca de R$ 35 mil o trecho é preço de tarifa cheia, não é a sua economia. Compare com o que você pagaria de fato. O vídeo é curto: complemente com o segundo vídeo, que faz a comparação na prática."}},{"titulo":"Executiva ou Econômica? Usando pontos Azul na Europa | Série: Como usar suas milhas Azul?","canal":"Pedro Gerador | Viagens sem perrengue","url":"https://www.youtube.com/watch?v=Y7pw-9QLizQ","publicado":"2026-06-19","duracao":"14:30","auditoria":{"nota":7,"risco":"Baixo","veredito":"Faz na tela o que esta aula pede: pesquisa um voo para a Europa no site da Azul e compara milhas contra dinheiro, executiva contra econômica, na mesma rota. Auditado pela descrição; sem capítulos nem transcrição acessível.","alerta":"É um único exemplo de rota e data, com preços de jun/2026 numa tabela dinâmica. Faça a conta com o custo real das suas milhas, não com o preço de venda do milheiro. A descrição traz links de compra de pontos Azul com bônus (assunto da etapa 3) e da agência do autor: não compre milhas antes de achar o assento."}}]}]}],"materiais":[]},{"modulo":7,"nivel":"Avançado","titulo":"Proteger o patrimônio","resumo":"Milhas são um ativo que pode sumir: golpe, desvalorização, conta bloqueada, empresa que quebra, imposto. O que quase nenhum curso pago ensina.","grupos":[{"tipo":"Riscos","aulas":[{"id":"seguranca-e-golpes","nome":"Segurança da conta e golpes","porque":"Um saldo de milhas é dinheiro guardado numa conta que muitas vezes só é protegida por e-mail e senha, e os golpistas sabem disso. Ao contrário do banco, não existe regra específica de reembolso para milhas roubadas: devolver ou não depende do programa aceitar a contestação. Prevenir sai muito mais barato do que tentar recuperar.","passos":["Troque a senha de cada programa (banco e companhias aéreas) por uma senha única e longa, guardada num gerenciador de senhas. Nunca repita a senha do seu e-mail.","Ative a verificação em duas etapas onde o programa oferecer e proteja também o e-mail cadastrado com 2FA: quem controla o seu e-mail consegue trocar a senha do programa.","Entre sempre digitando o endereço ou pelo app oficial. Ignore links de SMS, e-mail ou WhatsApp sobre 'milhas expirando' ou 'pontos para resgatar'.","Ligue as notificações de resgate e transferência e confira o extrato de cada programa uma vez por mês.","Se roubarem o saldo: avise o programa na hora pelos canais oficiais e peça bloqueio e estorno; troque as senhas do e-mail e do programa; registre boletim de ocorrência (dá para fazer na delegacia online); sem resposta, registre reclamação no consumidor.gov.br ou no Procon. Guarde prints de tudo."],"armadilhas":["Contratar uma 'emissão barata' pelo WhatsApp ou Instagram: o suposto especialista emite com milhas de origem duvidosa, cadastra o e-mail dele na reserva e você não consegue confirmar nada com a companhia. A passagem pode ser falsa ou cancelada, e um Pix para desconhecido não tem volta.","Passar login, senha ou código de verificação a alguém, seja 'comprador de milhas', 'gestor' ou 'suporte'. Nenhum programa pede código por telefone ou WhatsApp. Além do risco de roubo, os regulamentos proíbem repassar número e senha da conta.","Pedir ajuda ao programa pelas redes sociais e cair em perfis falsos que se apresentam como 'atendimento'.","Achar que vazamento de dados não é com você: em ago/2026 a LATAM confirmou uma falha de segurança que expôs dados de clientes (noticiado por Jovem Pan e Olhar Digital). Dados vazados alimentam golpes personalizados, com seu nome e número de cliente."],"dica":"Faça a conta do preço impossível. Se alguém oferece uma executiva para a Europa por R$ 2.000 e essa emissão costuma custar umas 150.000 milhas, só as milhas já valem R$ 3.000 com o milheiro a R$ 20 (150.000 ÷ 1.000 × R$ 20), sem contar as taxas. Ninguém honesto vende abaixo do custo: preço menor que o valor das próprias milhas indica golpe ou milhas roubadas. Os números são ilustrativos.","videos":[{"titulo":"Golpes com milhas aéreas aumentam durante temporada de viagens","canal":"Hoje em Dia","url":"https://www.youtube.com/watch?v=2PHSU6fiPuU","publicado":"2026-06-09","duracao":"6:07","auditoria":{"nota":7,"risco":"Baixo","veredito":"Reportagem de TV recente (jun/2026) sobre o golpe mais comum: SMS ou e-mail falso de 'milhas expirando' que leva a um site falso e rouba os dados. Mostra uma vítima real e não tem interesse comercial. Auditado por título e descrição; a transcrição não estava acessível.","alerta":"É jornalismo, não tutorial: não ensina a ativar 2FA nem a contestar um resgate. Para isso, use o 'Na prática' desta aula. Programa de verdade não pede senha nem código por mensagem."}},{"titulo":"Fraude de milhas aéreas: viajantes são vítimas de especialista falso e enfrentam prejuízos","canal":"Fala Brasil","url":"https://www.youtube.com/watch?v=QtZeps_kigQ","publicado":"2026-08-27","duracao":"5:05","auditoria":{"nota":7,"risco":"Baixo","veredito":"Caso real (ago/2026) de um 'especialista' que vendia executivas baratas emitidas com milhas. Os bilhetes eram falsos, o e-mail do golpista estava cadastrado nas reservas e uma vítima pagou R$ 11 mil para voltar da Europa. Ilustra bem o risco da 'emissão barata'. Auditado por título e descrição; a transcrição não estava acessível.","alerta":"A lição prática: antes de pagar, peça o localizador e confirme a reserva no site da companhia, com o seu e-mail cadastrado. Se o vendedor não deixar, é golpe. E quem compra passagem emitida com milhas de terceiros também corre o risco de ter o bilhete cancelado pelo programa."}}]},{"id":"desvalorizacao","nome":"Desvalorização: não estoque milhas","porque":"Milha não rende juros, só perde valor. O programa pode, a qualquer momento e seguindo apenas o próprio regulamento, aumentar quantas milhas uma passagem custa, mudar a tabela ou cortar parceiros. Quem guarda milhas 'para um dia' está apostando que as regras não vão piorar, e a história recente mostra que pioram.","passos":["Defina um horizonte: acumule pensando numa viagem dos próximos 12 a 24 meses, não 'para um dia'.","Deixe os pontos no programa do banco (Livelo, Esfera ou programa próprio) até a viagem estar definida e só transfira para a companhia aérea na hora de emitir.","Acompanhe as notícias do seu programa em blogs especializados (ex.: Passageiro de Primeira, Melhores Destinos, Pontos pra Voar): reajustes costumam ser anunciados poucas semanas antes.","Se sair um reajuste e você já tiver saldo e viagem planejada, avalie emitir antes da data. Faça isso só para uma viagem que você faria de qualquer jeito.","Se você tem um saldo grande parado, calcule hoje o valor do milheiro num resgate real que você faria. Se o valor for aceitável, usar agora costuma ser melhor do que esperar."],"armadilhas":["Comprar milhas em promoção 'porque está barato' sem viagem marcada: é pagar adiantado por algo que pode custar mais milhas amanhã.","Achar que tabela fixa é garantia: a LATAM Pass reajustou a tabela fixa de companhias parceiras em mar/2026 e anunciou novo aumento, de cerca de 20% em várias rotas, a partir de 23/11/2026 (Passageiro de Primeira, Pontos pra Voar).","Ignorar o risco da empresa: GOL (jan/2024 a jun/2025) e Azul (mai/2025 a fev/2026) passaram por recuperação judicial nos EUA (Chapter 11). Nos dois casos os programas continuaram funcionando e as milhas foram mantidas, mas milha não tem garantia do FGC. Numa falência, o cliente vira, na melhor hipótese, mais um credor.","Confundir bônus de transferência com valorização: um bônus alto não protege o saldo de um reajuste futuro."],"dica":"Todo aumento no preço em milhas é uma perda direta do seu saldo. Se uma passagem sobe de 150.000 para 180.000 milhas (+20%), cada milha passa a comprar 1/1,2 do que comprava antes: o seu saldo perdeu cerca de 16,7% do poder de compra (1 − 150.000 ÷ 180.000) da noite para o dia, sem você fazer nada. Por isso a regra é 'ganhe e gaste'.","videos":[{"titulo":"Tabela fixa LATAM Pass sobe 20% em 23/11: o que muda trecho por trecho","canal":"Lucas por Milhas","url":"https://www.youtube.com/watch?v=E2wofX2MiVs","publicado":"2026-11-04","duracao":"12:40","auditoria":{"nota":8,"risco":"Baixo","veredito":"Exemplo real e atual (nov/2026) de desvalorização: explica o reajuste de cerca de 20% na tabela fixa de parceiras da LATAM Pass, cita a página oficial com a data da consulta e converte os exemplos em reais. As contas da descrição batem. O canal é pequeno, mas o reajuste foi confirmado pela imprensa especializada. Auditado por título e descrição detalhada; a transcrição não estava acessível.","alerta":"Os valores em reais usam milheiro de R$ 24 e taxa estimada de R$ 300, só como exemplo. Não corra para emitir 'antes que suba' uma viagem que você não faria. A descrição tem links de afiliado (Seats.aero, seguro viagem)."}},{"titulo":"Milhas em queda livre! Saiba como proteger seus pontos da inflação!","canal":"Pontos pra Voar","url":"https://www.youtube.com/watch?v=J4YVSMUFbiU","publicado":"2025-08-05","duracao":"6:09","auditoria":{"nota":6,"risco":"Baixo","veredito":"Vídeo curto da editora do Pontos pra Voar sobre a 'inflação das milhas' e como se proteger dela, sem promessa de ganho nem venda de curso. É de ago/2025, mas o conceito não envelhece. Auditado só por título e descrição curta (sem capítulos nem transcrição acessível): confiança menor.","alerta":"Não cobre o risco de recuperação judicial das companhias nem os reajustes de 2026; complemente com o texto desta aula. Qualquer número citado no vídeo é de 2025."}}]},{"id":"emissao-para-terceiros","nome":"Emissão para terceiros e limite de beneficiários","porque":"Emitir passagens com as suas milhas para pais, filhos ou cônjuge é permitido e é um dos melhores usos do saldo. Mas todos os grandes programas limitam quantas pessoas diferentes podem receber essas emissões, justamente para dificultar a venda de passagens. Quem não conhece o limite pode ficar sem conseguir emitir na hora da viagem ou ter a conta investigada.","passos":["Liste quem de fato viaja com as suas milhas (família próxima) e estime quantas pessoas diferentes por ano.","Leia a regra de beneficiários no regulamento atual do seu programa. Referências de nov/2026, que mudam: a Smiles conta pessoas distintas por ano civil (hoje, até 25); a LATAM Pass conta terceiros distintos numa janela de 12 meses (na casa de duas dezenas); a Azul Fidelidade usa uma lista fixa de beneficiários, cujo tamanho depende da categoria e de campanhas, com carência (hoje, de 30 dias) para emitir para quem acabou de entrar na lista.","Na Azul, cadastre os beneficiários com antecedência, antes de aparecer a promoção, e evite ficar trocando os nomes da lista.","Para juntar as milhas da família, prefira o caminho oficial (ex.: Conta Família Smiles) em vez de usar o login e a senha de parentes.","Emita sempre com os dados certos do passageiro (nome igual ao do documento) e anote numa planilha simples: para quem, quando e por qual programa."],"armadilhas":["Gastar as 'vagas' de beneficiário com amigos e conhecidos e ficar sem vaga para a família no fim do ano.","Cobrar do amigo pela passagem emitida: aí deixa de ser presente e vira comercialização, que os regulamentos proíbem e que pode levar ao bloqueio da conta.","Usar CPFs ou contas de parentes para 'multiplicar' o limite, como ensinam vários cursos de venda de milhas: isso pode levar ao bloqueio de todas as contas envolvidas.","Confiar em números de vídeos e blogs: os limites mudam. A Azul, por exemplo, já mudou o tamanho da lista e a carência, e de vez em quando faz ampliações temporárias. Vale o regulamento do dia."],"dica":"Faça a conta da sua família antes de se preocupar. Um casal com dois filhos ocupa 3 vagas de terceiros (o titular não conta) num programa que conta pessoas distintas, mesmo emitindo para eles várias vezes no ano. Isso cabe com folga nos limites atuais de Smiles e LATAM Pass; confirme se o seu programa conta por pessoa ou por bilhete. Se a sua conta está batendo no limite, a pergunta honesta é: para quem você está emitindo?","videos":[{"titulo":"Limite de CPF nas companhias aéreas: como funciona?","canal":"Cartões, Milhas e Viagens","url":"https://www.youtube.com/watch?v=k387mexlxyg","publicado":"2025-05-20","duracao":"7:05","auditoria":{"nota":6,"risco":"Médio","veredito":"Cobre os três programas numa aula curta: quantos CPFs, como é a contagem, se dá para emitir várias vezes para a mesma pessoa e o que acontece quando o limite estoura, inclusive o risco de bloqueio. É de mai/2025 e cita o 'mercado paralelo' como parte do público. Auditado por título e descrição; a transcrição não estava acessível.","alerta":"Os números podem ter mudado desde mai/2025 (a Azul, por exemplo, alterou a lista de beneficiários); confira no regulamento. Ignore os convites para grupo de emissões e mentoria: o limite existe para você usar com a família, não para 'otimizar' vendas."}},{"titulo":"Antes de criar a Conta Família Smiles, assista a este vídeo","canal":"Sara Reis","url":"https://www.youtube.com/watch?v=bjyF_x7QLjM","publicado":"2026-09-23","duracao":"10:23","auditoria":{"nota":7,"risco":"Baixo","veredito":"Recente (set/2026) e focado no uso legítimo: como funciona a Conta Família Smiles, quem pode entrar, o que acontece com as milhas que cada um já tinha e a regra dos 12 meses, que pode gerar arrependimento. Auditado pela descrição detalhada; a transcrição não estava acessível.","alerta":"Na conta família, as milhas passam a ser administradas por uma pessoa; combine isso com a família antes. Vale só para a Smiles: LATAM Pass e Azul têm regras próprias. A descrição leva a curso e grupo de alertas pagos."}}]},{"id":"venda-de-milhas","nome":"Venda de milhas: o que os cursos não contam","porque":"Muitos cursos pagos apresentam a venda de milhas como 'renda extra' sem contar a regra do jogo. Os regulamentos de Smiles, LATAM Pass e Azul Fidelidade proíbem comercializar milhas e passagens emitidas com elas, e em 2024 o STJ considerou válido esse tipo de proibição (REsp 2.011.456). Esta aula não ensina a vender: mostra os riscos para você decidir de olhos abertos.","passos":["Leia, no regulamento do seu programa, as cláusulas sobre comercialização, cessão de milhas e repasse de login e senha, e veja o que o programa pode fazer em caso de violação (bloquear a conta, cancelar o saldo e as passagens).","Se pensa em vender porque as milhas vão vencer, compare antes as saídas permitidas: emitir para a família, usar em produto ou cashback do próprio programa, ou aceitar perder um saldo pequeno.","Se mesmo assim decidir vender, nunca entregue a sua senha: quem tem a senha controla a conta e o saldo inteiro.","Pesquise a situação do intermediário (Reclame Aqui, processos, notícias) e entenda que o risco de calote é seu.","Registre tudo (datas, valores, quem comprou) e veja a próxima aula: o ganho com a venda pode pagar imposto."],"armadilhas":["Bloqueio de conta e perda do saldo: os programas monitoram padrões (muitas emissões para terceiros, acessos de lugares diferentes) e podem suspender a conta, cancelar o saldo e até passagens já emitidas. A biometria facial na emissão (LATAM Pass, e relatos na Smiles em 2026) aumentou esse controle.","Risco de contraparte: 123milhas, MaxMilhas e HotMilhas (Grupo 123) estão em recuperação judicial desde 2023, com dívidas de cerca de R$ 2,4 bilhões segundo a imprensa e plano de pagamento em vários anos. Quem vendeu milhas ou comprou passagens por elas virou credor, e muitos ainda esperam receber.","Achar que a 'nova lei' já liberou a venda: o PL 3.083/2026, aprovado pela Câmara em 13/08/2026, ainda depende do Senado e da sanção presidencial. Até virar lei, valem os regulamentos de hoje.","Entregar login, senha ou código de verificação a 'compradores' ou 'gestores de milhas': além de violar o regulamento, isso abre a porta para o roubo do saldo inteiro."],"dica":"Coloque o risco na conta. Exemplo ilustrativo: vender 50.000 milhas a R$ 16 o milheiro rende R$ 800. Se a conta for bloqueada e ainda tinha 200.000 milhas que você usaria numa viagem a uns R$ 20 o milheiro, o prejuízo é de R$ 4.000, cinco vezes o que você recebeu. E isso sem contar o risco de não receber do comprador e o imposto sobre o ganho.","videos":[{"titulo":"Por Que EU NÃO Recomendo Vender Milhas? Os RISCOS Que Ninguém Conta!","canal":"Caio Milhas | Caio Gonçalves","url":"https://www.youtube.com/watch?v=TmQUkgiuwAI","publicado":"2026-01-07","duracao":"18:16","auditoria":{"nota":7,"risco":"Baixo","veredito":"Um dos poucos criadores de conteúdo de milhas que diz com todas as letras que não recomenda vender. Lista banimento do programa, bloqueio de CPF, risco de crédito, não recebimento, oscilação de preço e mercado não regulado, e aponta alternativas (viajar, cashback, presentear). Auditado por título e descrição detalhada; a transcrição não estava acessível.","alerta":"É de jan/2026: não cobre o PL 3.083/2026 nem a biometria facial, e não fala do imposto de renda sobre o ganho (veja a próxima aula). A comunidade paga anunciada como 'zero risco' é publicidade: nenhum uso de milhas tem risco zero."}},{"titulo":"Companhias aéreas podem proibir venda de milhas em programas de fidelidade, define Terceira Turma","canal":"Superior Tribunal de Justiça (STJ)","url":"https://www.youtube.com/watch?v=SRH_SHvyNCk","publicado":"2024-06-11","duracao":"1:57","auditoria":{"nota":8,"risco":"Baixo","veredito":"Fonte oficial: o próprio STJ explica a decisão da Terceira Turma (REsp 2.011.456) que considerou lícita a cláusula que proíbe vender milhas a terceiros, por serem bonificações gratuitas da companhia. Curto e sem interesse comercial. Auditado por título e descrição; a transcrição não estava acessível.","alerta":"É de 2024 e julga um caso concreto (não é súmula), mas é a referência do STJ sobre o tema. Se o PL 3.083/2026 virar lei, o cenário pode mudar; até lá, vale o regulamento do programa."}}]},{"id":"imposto-de-renda","nome":"Milhas e imposto de renda","porque":"Quem acumula milhas para viajar normalmente não paga imposto por isso. O problema começa quando a pessoa compra e vende milhas: pode haver ganho, e a Receita acompanha a movimentação bancária. E em set/2026 o STJ decidiu que milhas com valor econômico mensurável são bens digitais do patrimônio e podem ser penhoradas para pagar dívidas (REsp 2.198.485). Isso não muda a regra do imposto, mas mostra que milhas são tratadas como patrimônio.","passos":["Se você só acumula e usa milhas para viajar, em geral não há imposto nem obrigação de declarar o saldo. Alguns contadores sugerem informar em Bens e Direitos sem valor.","Se comprou milhas ou pontos (clube, compra direta), guarde os comprovantes: valor pago, data, quantidade e programa. Compras de valor relevante podem precisar entrar em Bens e Direitos pelo custo.","Se vendeu, registre a data, o valor, a quantidade e quem comprou (nome e CPF/CNPJ), e some o total vendido em cada mês.","Leve esses dados a um contador antes da declaração: ele define o enquadramento do seu caso (ganho de capital, rendimento ou atividade).","Se houver imposto a pagar, não espere a declaração anual: no regime de ganho de capital, o DARF vence no último dia útil do mês seguinte ao da venda."],"armadilhas":["Tratar orientação de blog como regra oficial: não localizamos (nov/2026) nenhuma Solução de Consulta da Receita Federal específica sobre venda de milhas por pessoa física. O que existe é a interpretação de contadores e consultorias, como a de que a venda é ganho de capital.","Achar que o limite de isenção é anual ou sobre o lucro: na leitura mais comum (ganho de capital de bens de pequeno valor), o limite de R$ 35 mil vale para o total vendido no mês.","Esquecer o custo das milhas: milhas ganhas no cartão podem ser consideradas de custo zero, o que transforma todo o valor da venda em ganho. Quem vende com frequência ainda pode ter a atividade tratada como rendimento ou como negócio.","Achar que 'ninguém fica sabendo': o dinheiro chega por Pix e pela conta bancária, e a Receita recebe informações dessas movimentações."],"dica":"Exemplo ilustrativo, na leitura mais comum (ganho de capital): você comprou 100.000 milhas por R$ 1.500 e vendeu por R$ 1.800, um ganho de R$ 300. Se o total vendido no mês ficou abaixo de R$ 35 mil, esse ganho costuma ser declarado como isento. Acima disso, o imposto começa em 15% sobre o ganho (R$ 45 neste exemplo), apurado no programa GCAP. Repare que a isenção olha o total vendido no mês, não o lucro. Consulte um contador: a Receita não tem regra específica para milhas, e o enquadramento pode mudar.","videos":[{"titulo":"VENDA DE MILHAS: Como Pagar Menos Imposto (ou Zero) Sem Erros!","canal":"Contador do Investidor","url":"https://www.youtube.com/watch?v=_Dq6I9fyBCs","publicado":"2026-01-15","duracao":"12:50","auditoria":{"nota":6,"risco":"Médio","veredito":"Conteúdo de um contador sobre o que importa: milhas como bens ou direitos, a isenção de R$ 35 mil por mês, o custo de aquisição de milhas 'orgânicas' versus compradas, o GCAP com o DARF e o risco de não declarar. Auditado por título e descrição; a transcrição não estava acessível.","alerta":"O título promete 'pagar menos imposto (ou zero)' e a descrição fala em 'escalar esse negócio'. Aqui o objetivo é entender a regra, não montar um negócio de venda, que continua proibido pelos regulamentos. Como não há regra específica da Receita para milhas, trate o enquadramento como interpretação."}},{"titulo":"\"🛫 Você Sabe Como Declarar MILHAS AÉREAS no Imposto de Renda? Veja Antes de Cair na Malha Fina!\"","canal":"Contabilidade Olímpia","url":"https://www.youtube.com/watch?v=L38jnN8k33c","publicado":"2025-06-05","duracao":"2:12","auditoria":{"nota":5,"risco":"Baixo","veredito":"Explicação curta (2 minutos) de um escritório de contabilidade sobre quando declarar milhas acumuladas e vendidas no IRPF 2025, sem vender nada além do próprio serviço. É superficial, mas serve de primeira orientação. Auditado só por título e descrição; a transcrição não estava acessível, por isso a confiança é menor.","alerta":"É do IRPF 2025 e, em 2 minutos, não dá conta de custo de aquisição, limite mensal e DARF. Não decida sozinho com base nele: leve os seus números a um contador."}}]}]}],"materiais":[{"titulo":"STJ: companhia aérea pode proibir venda de milhas","descricao":"Conjur · REsp 2.011.456, 2024","url":"https://www.conjur.com.br/?p=757723"},{"titulo":"STJ: milhas podem ser penhoradas para pagar dívidas","descricao":"Lex · REsp 2.198.485, 2026","url":"https://www.lex.com.br/milhas-e-pontos-de-programas-de-fidelidade-podem-ser-penhorados-para-pagar-dividas/"},{"titulo":"Câmara aprova regras para venda de milhas (PL 3.083/2026)","descricao":"Agência Câmara · ainda depende do Senado","url":"https://www.camara.leg.br/noticias/1297482-camara-aprova-novas-regras-para-venda-e-troca-de-milhas-por-dinheiro"}]}],"glossario":[{"termo":"CPM","categoria":"Siglas e jargão","definicao":"Custo por milheiro: quanto você pagou, em reais, por cada mil milhas. É a conta central do assunto: só vale resgatar quando o resgate vale mais do que o CPM.","variantes":["custo do milheiro","custo por milheiro"],"modulos":[3,4]},{"termo":"Milheiro","categoria":"Siglas e jargão","definicao":"Um lote de mil pontos ou milhas. Preços, custos e cotações quase sempre são dados por milheiro (ex.: 'milheiro a R$ 18').","variantes":["milheiros"],"modulos":[3]},{"termo":"Pontos por dólar","categoria":"Siglas e jargão","definicao":"Quantos pontos o cartão dá a cada dólar gasto. O banco converte o gasto em reais para dólar só para essa conta, mesmo em compras no Brasil.","variantes":["pts/US$","pontos por dólar gasto"],"modulos":[2]},{"termo":"Bonificada","categoria":"Siglas e jargão","definicao":"Jeito curto de falar de transferência bonificada ou compra bonificada: uma promoção que dá pontos ou milhas extras.","modulos":[2,3]},{"termo":"Hub","categoria":"Siglas e jargão","definicao":"Programa que junta pontos para depois mandar para vários destinos, como Livelo e Esfera. Deixar os pontos no hub dá flexibilidade para escolher a companhia aérea só na hora de usar.","modulos":[1,3]},{"termo":"Emissão","categoria":"Siglas e jargão","definicao":"O ato de gerar a passagem (o bilhete) usando milhas. 'Emitir' é comprar com milhas.","variantes":["emitir","emissões"],"modulos":[4]},{"termo":"Programa de fidelidade","categoria":"Programas","definicao":"Sistema em que uma empresa dá pontos ou milhas a quem compra dela ou de parceiros, para trocar depois por produtos e passagens.","variantes":["programas de fidelidade"],"modulos":[1]},{"termo":"Pontos","categoria":"Programas","definicao":"Moeda dos programas de bancos e varejo (Livelo, Esfera, programas próprios dos bancos). Normalmente não viram passagem direto: precisam ser transferidos para uma companhia aérea.","variantes":["ponto"],"modulos":[1]},{"termo":"Milhas","categoria":"Programas","definicao":"Moeda dos programas de companhias aéreas (Smiles, LATAM Pass, Azul Fidelidade). Servem para emitir passagens dessa companhia e de parceiras.","variantes":["milha"],"modulos":[1]},{"termo":"Livelo","categoria":"Programas","definicao":"Programa de pontos ligado a Banco do Brasil e Bradesco, entre outros. Funciona como hub: recebe pontos de cartões e parceiros e transfere para várias companhias aéreas.","modulos":[1,3]},{"termo":"Esfera","categoria":"Programas","definicao":"Programa de pontos do Santander. Também funciona como hub, com transferência para companhias aéreas.","modulos":[1,3]},{"termo":"Smiles","categoria":"Programas","definicao":"Programa de milhas da Gol. Emite voos da Gol e de companhias parceiras.","modulos":[1,4]},{"termo":"LATAM Pass","categoria":"Programas","definicao":"Programa de milhas da LATAM. Emite voos da LATAM e de parceiras.","modulos":[1,4]},{"termo":"Azul Fidelidade","categoria":"Programas","definicao":"Programa de pontos da Azul, que até 2024 se chamava TudoAzul. Emite voos da Azul e de parceiras.","variantes":["TudoAzul"],"modulos":[1,4]},{"termo":"Aliança aérea","categoria":"Programas","definicao":"Grupo de companhias que aceitam as milhas umas das outras: Star Alliance, oneworld e SkyTeam. É o que permite usar milhas de um programa para voar em outra companhia.","variantes":["alianças","Star Alliance","oneworld","SkyTeam"],"modulos":[6],"avancado":true},{"termo":"Programa estrangeiro","categoria":"Programas","definicao":"Programa de milhas de companhia de fora do Brasil (TAP Miles&Go, Avios, Flying Blue, AAdvantage). Às vezes cobra menos milhas por um voo internacional do que os programas brasileiros.","variantes":["programas estrangeiros"],"modulos":[6],"avancado":true},{"termo":"Avios","categoria":"Programas","definicao":"Moeda de milhas compartilhada por British Airways, Iberia, Qatar Airways e outras. Alguns hubs brasileiros transferem para ela.","modulos":[6],"avancado":true},{"termo":"Shopping de pontos","categoria":"Acúmulo","definicao":"Portal do programa (ex.: Shopping Livelo, Shopping Smiles) que leva você a lojas parceiras. Comprando a partir dele, você ganha pontos extras além dos do cartão.","variantes":["shoppings de pontos","shopping Livelo","Shopping Smiles"],"modulos":[2]},{"termo":"Compra bonificada","categoria":"Acúmulo","definicao":"Promoção em que uma loja dá vários pontos por real gasto. Só vale se você já ia comprar aquele produto, por um preço que já era bom.","variantes":["compras bonificadas"],"modulos":[2]},{"termo":"Cashback","categoria":"Acúmulo","definicao":"Devolução de parte do valor gasto em dinheiro. Para quem viaja pouco, costuma render mais do que pontos, porque não desvaloriza nem expira.","modulos":[2,5]},{"termo":"Milhas qualificáveis","categoria":"Acúmulo","definicao":"Milhas ou pontos que contam para subir de categoria no programa (status). São diferentes das milhas que você usa para emitir passagem.","variantes":["qualificáveis"],"modulos":[2]},{"termo":"Categoria","categoria":"Acúmulo","definicao":"Nível de status no programa (ex.: Prata, Ouro, Diamante). Dá benefícios como bagagem, embarque prioritário e mais milhas por voo. Depende de voar ou gastar muito.","variantes":["status","categoria elite"],"modulos":[2]},{"termo":"Paridade","categoria":"Transferência","definicao":"Quantas milhas você recebe por ponto transferido. Ex.: paridade 1:1 = 1 ponto vira 1 milha. Muda por programa e por cartão; confira antes de transferir.","variantes":["paridades"],"modulos":[3]},{"termo":"Transferência bonificada","categoria":"Transferência","definicao":"Promoção em que, ao transferir pontos do banco para a companhia aérea, você ganha um bônus (ex.: 80% a mais). É o principal jeito de baixar o CPM.","variantes":["transferências bonificadas"],"modulos":[3]},{"termo":"Bumerangue","categoria":"Transferência","definicao":"Campanha da Livelo que devolve parte dos pontos transferidos depois de um prazo. Conta como desconto no custo, mas os pontos voltam só depois e com regras próprias.","modulos":[3],"avancado":true},{"termo":"Clube de assinatura","categoria":"Transferência","definicao":"Mensalidade paga a um programa (ex.: Clube Smiles, Clube Livelo) que dá pontos todo mês e acesso a bônus maiores. Só compensa se você vai usar as milhas.","variantes":["clube","clubes","clubes de assinatura","clube de milhas"],"modulos":[3]},{"termo":"Tabela fixa","categoria":"Resgate","definicao":"Quando o programa cobra uma quantidade fixa de milhas por trecho, independentemente do preço da passagem em dinheiro. Costuma ser o melhor uso de milhas.","modulos":[4,6]},{"termo":"Tabela dinâmica","categoria":"Resgate","definicao":"Quando o preço em milhas sobe e desce junto com o preço em dinheiro. É o modelo da maioria dos programas brasileiros hoje e reduz as 'pechinchas'.","variantes":["dinâmica","preço dinâmico"],"modulos":[4]},{"termo":"Taxa de embarque","categoria":"Resgate","definicao":"Cobrança do aeroporto paga em dinheiro mesmo em passagem com milhas. Por isso não existe passagem 100% grátis.","variantes":["taxas de embarque"],"modulos":[4]},{"termo":"Sobretaxa de combustível","categoria":"Resgate","definicao":"Cobrança extra em dinheiro que algumas companhias somam em voos internacionais com milhas. Pode deixar o resgate caro; compare antes de emitir.","variantes":["YQ","sobretaxas"],"modulos":[4,6],"avancado":true},{"termo":"Disponibilidade","categoria":"Resgate","definicao":"Assentos que a companhia libera para resgate com milhas. É limitada, principalmente em executiva e alta temporada; um preço visto num print não garante que você vai achar igual.","variantes":["assento prêmio"],"modulos":[4,6]},{"termo":"Stopover","categoria":"Resgate","definicao":"Parada de mais de 24 horas numa cidade no meio do caminho, dentro da mesma emissão. Alguns programas permitem e assim dá para conhecer dois lugares pelo preço de um trecho.","variantes":["stopovers"],"modulos":[6],"avancado":true},{"termo":"Overbooking","categoria":"Resgate","definicao":"Quando a companhia vende mais assentos do que o avião tem. Se você for impedido de embarcar, tem direitos de assistência e compensação, inclusive em passagem com milhas.","modulos":[4]},{"termo":"Anuidade","categoria":"Cartões","definicao":"Taxa anual do cartão. Os cartões que mais pontuam costumam ter anuidade alta; ela precisa ser menor do que o valor dos pontos que você realmente gera.","variantes":["anuidades"],"modulos":[2]},{"termo":"Downgrade","categoria":"Cartões","definicao":"Trocar o cartão por uma categoria inferior, geralmente para fugir de uma anuidade que não se paga. Também se diz de trocar a classe da passagem para uma mais barata.","modulos":[2]},{"termo":"Spread cambial","categoria":"Cartões","definicao":"Diferença entre a cotação de mercado e a que o banco usa nas compras em dólar. Junto com o IOF, encarece gastar no exterior para ganhar pontos.","variantes":["spread"],"modulos":[2]},{"termo":"IOF","categoria":"Cartões","definicao":"Imposto sobre operações financeiras cobrado em compras internacionais no cartão. Precisa entrar na conta quando se compara com o valor dos pontos ganhos.","modulos":[2]},{"termo":"Sala VIP","categoria":"Cartões","definicao":"Sala de espera no aeroporto com comida e conforto. O acesso vem do cartão (Priority Pass, LoungeKey, DragonPass) ou da categoria/classe do voo, com regras de quantidade de visitas e convidados.","variantes":["salas VIP","lounge"],"modulos":[5]},{"termo":"Priority Pass","categoria":"Cartões","definicao":"Programa de acesso a salas VIP pelo mundo, oferecido por alguns cartões. Confira quantas visitas grátis o seu dá e quanto custa o convidado.","variantes":["LoungeKey","DragonPass"],"modulos":[5]},{"termo":"Rotativo","categoria":"Riscos","definicao":"Crédito automático quando você paga menos que o total da fatura. Tem dos juros mais altos do país: um mês de rotativo apaga anos de pontos.","variantes":["juros do rotativo","pagamento mínimo"],"modulos":[1]},{"termo":"Desvalorização","categoria":"Riscos","definicao":"Quando o programa passa a pedir mais milhas pelo mesmo voo. Acontece sem aviso e é o motivo para não estocar milhas por anos.","variantes":["desvalorizações"],"modulos":[7]},{"termo":"Expiração","categoria":"Riscos","definicao":"Data em que pontos ou milhas vencem e somem. Cada programa tem prazo próprio, e clubes às vezes estendem esse prazo.","variantes":["validade","expirar","expiram"],"modulos":[1]},{"termo":"Limite de beneficiários","categoria":"Riscos","definicao":"Regra que limita quantas pessoas diferentes podem receber passagens emitidas com a sua conta, por ano. Muda por programa; existe para coibir a venda de milhas.","variantes":["beneficiários","limite de CPF"],"modulos":[7]},{"termo":"Venda de milhas","categoria":"Riscos","definicao":"Vender milhas ou emitir passagens para desconhecidos em troca de dinheiro. É proibida pelos regulamentos dos programas e pode levar ao bloqueio da conta e à perda do saldo.","variantes":["vender milhas"],"modulos":[7],"avancado":true},{"termo":"Risco de contraparte","categoria":"Riscos","definicao":"Risco de quem está do outro lado não cumprir o combinado, como a empresa que compra suas milhas e não paga. Em 2023, a 123milhas e a MaxMilhas entraram em recuperação judicial.","variantes":["contraparte"],"modulos":[7],"avancado":true}],"regras":[{"titulo":"Fatura paga inteira, sempre","texto":"Milhas são um desconto pequeno sobre o que você já gasta. Os juros do rotativo e do parcelamento da fatura passam de 10% ao mês; um único mês no rotativo custa mais do que anos de pontos. Se não consegue pagar o total, a estratégia certa agora é outra."},{"titulo":"Nunca gaste mais por causa de pontos","texto":"Compra bonificada, meta de gasto para ganhar bônus, cartão adicional para 'pontuar mais': nada disso compensa se o gasto não aconteceria de qualquer jeito."},{"titulo":"Faça a conta antes de cada passo","texto":"Antes de comprar pontos, transferir ou emitir, compare o custo do milheiro (CPM) com o valor que ele vai ter no resgate. Use a aba Contas."},{"titulo":"Acumule com objetivo, gaste com propósito","texto":"Milha é uma moeda que desvaloriza e expira. Junte pensando numa viagem e use quando o resgate for bom. Estoque grande parado é risco, não patrimônio."},{"titulo":"Não transfira sem destino e sem bônus","texto":"Deixe os pontos no programa do banco até ter uma viagem em vista e uma promoção de transferência ativa. Transferência não tem volta."},{"titulo":"Não existe passagem de graça","texto":"Taxas de embarque, sobretaxas, anuidade e mensalidade de clube são pagas em dinheiro. Some tudo antes de dizer que economizou."},{"titulo":"Desconfie de renda extra","texto":"Vender milhas é proibido pelos regulamentos, pode bloquear sua conta, tem risco de calote de quem compra e pode ter imposto. Cursos que vendem 'renda com milhas' quase nunca contam isso."},{"titulo":"Leia o regulamento","texto":"Paridade, validade, limite de beneficiários e regras de cancelamento mudam sem aviso. O que vale é o regulamento oficial do programa no dia, não o vídeo de um ano atrás."},{"titulo":"Trate a conta como uma conta de banco","texto":"Senha única, verificação em duas etapas e nunca passe a senha para ninguém, nem para 'emitir para você'. Golpes de milhas são comuns e o programa nem sempre devolve o saldo."},{"titulo":"Simples ganha do complicado","texto":"Um cartão que se paga, um programa de banco como hub e uma ou duas companhias aéreas resolvem a vida da maioria das pessoas. Complexidade só vale se a conta mostrar ganho."}],"mapa":[{"nome":"O gasto","exemplos":"cartão, lojas, contas","descricao":"Tudo começa com o que você já gasta. O cartão de crédito é o motor principal; lojas parceiras, combustível e apps complementam.","ganha":"Cartão que pontua bem e se paga; comprar via shopping de pontos o que já ia comprar.","perde":"Rotativo, gastar mais para pontuar, anuidade maior que o retorno.","modulos":[1,2]},{"nome":"O programa do banco","exemplos":"Livelo, Esfera","descricao":"Os pontos do cartão caem no programa do banco, que funciona como hub: guarda e depois manda para a companhia aérea que você escolher.","ganha":"Esperar uma transferência bonificada; manter flexibilidade até ter uma viagem em vist

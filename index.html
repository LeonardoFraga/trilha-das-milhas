const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const slug = s => norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const TECHS = [];
DATA.forEach(m => m.grupos.forEach(g => g.aulas.forEach(t => {

  t.modulo = m.modulo; t.grupo = g.tipo;
  TECHS.push(t);
})));
const TECH_BY_ID = Object.fromEntries(TECHS.map(t => [t.id, t]));
const MAX = Math.max(1, TECHS.length * 3);
const NMOD = DATA.length;

// categorias de status, como nos programas de fidelidade
const TIERS = ["Básico", "Prata", "Ouro", "Platina", "Diamante"];
const GLOSS = (SITE.glossario || []).map(g => ({ ...g, id: "g-" + slug(g.termo) }));
const SIGLAS = "Siglas e jargão";   // categoria que fica no Início, não nos filtros do glossário
const modTitle = n => (DATA.find(m => m.modulo === n) || {}).titulo || "";
const modOf = n => DATA.find(m => m.modulo === n) || {};

const LS_KEY = "trilha-das-milhas-progresso-v1";
let state = {};               // id -> 0..3
try { state = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { state = {}; }

const lv = t => state[t.id] || 0;
const current = () => TECHS.find(t => lv(t) < 3) || null;
function totals(){
  let pts = 0; const c = [0,0,0,0];
  TECHS.forEach(t => { const l = lv(t); pts += l; for (let i = 1; i <= l; i++) c[i]++; });
  const pct = Math.round(pts / MAX * 100);
  const tier = Math.min(4, Math.floor(pts / MAX * 4 + 1e-9));
  return { pts, c, pct, tier };
}
function modStats(n){
  const ts = TECHS.filter(t => t.modulo === n);
  const pts = ts.reduce((a,t) => a + lv(t), 0);
  return { ts, total: ts.length, done: ts.filter(t => lv(t) === 3).length, frac: ts.length ? pts / (ts.length * 3) : 0 };
}

function ytId(url){
  try {
    const u = new URL(url);
    if (u.hostname.includes("youtu.be")) return u.pathname.slice(1);
    return u.searchParams.get("v") || (u.pathname.match(/\/(?:shorts|embed|live)\/([\w-]+)/) || [])[1] || "";
  } catch (e) { return ""; }
}
const riskCls = r => ({ "baixo": "baixo", "médio": "medio", "medio": "medio", "alto": "alto" })[norm(r)] || "medio";
const ano = d => (String(d || "").match(/^\d{4}/) || [""])[0];

/* ---------- termos do glossário no texto ---------- */
// cada termo e variante vira um padrão; os mais longos primeiro para "tabela dinâmica" vencer "tabela"
const GL_INDEX = [];
GLOSS.forEach((g, i) => [g.termo, ...(g.variantes||[])].filter(v => !(g.sem_destaque||[]).includes(v)).forEach(v => { if (v && v.length > 2) GL_INDEX.push([v, i]); }));
GL_INDEX.sort((a,b) => b[0].length - a[0].length);
const GL_LOOKUP = new Map(GL_INDEX.map(([v,i]) => [norm(v), i]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
let GL_RE = null;
try {
  if (GL_INDEX.length) GL_RE = new RegExp("(?<![\\p{L}\\p{N}])(" + GL_INDEX.map(([v]) => reEsc(v)).join("|") + ")(?![\\p{L}\\p{N}])", "giu");
} catch (e) { GL_RE = null; }

// escapa o texto e marca a primeira ocorrência de cada termo (por aula)
function gloss(text, seen){
  if (!GL_RE || !text) return esc(text);
  let out = "", last = 0; GL_RE.lastIndex = 0; let m;
  while ((m = GL_RE.exec(text))) {
    const i = GL_LOOKUP.get(norm(m[1]));
    out += esc(text.slice(last, m.index));
    if (i !== undefined && !seen.has(i)) { seen.add(i); out += `<span class="gl" role="button" tabindex="0" data-g="${i}">${esc(m[1])}</span>`; }
    else out += esc(m[1]);
    last = m.index + m[1].length;
  }
  return out + esc(text.slice(last));
}

let playing = null;   // { btn, frame }: a miniatura que virou player, para poder voltar
function play(btn){
  stopVideo();
  const id = btn.dataset.play, card = btn.closest(".video");
  const frame = document.createElement("div"); frame.className = "vframe";
  frame.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&playsinline=1&rel=0"
    title="${esc(card.querySelector(".vt b").textContent)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  btn.replaceWith(frame); card.classList.add("on");
  playing = { btn, frame };
}
function stopVideo(){
  if (playing && playing.frame.isConnected) { playing.frame.parentNode.classList.remove("on"); playing.frame.replaceWith(playing.btn); }
  playing = null;
}
function stepper(t){
  const l = lv(t);
  return `<div class="stepper" role="group" aria-label="Seu nível em ${esc(t.nome)}">${[1,2,3].map(n =>

}
function nowLine(t){
  const l = lv(t);
  if (l >= 3) return `<p class="now"><b>Aplicada.</b> Revise de vez em quando: as regras dos programas mudam.</p>`;

function route_(){
  const { pts, c, pct, tier } = totals();
  const p = pts / MAX;
  const next = TIERS[Math.min(4, tier + 1)];
  const msg = pts === 0 ? "Seu voo ainda não decolou. Comece pela etapa 1."
    : tier === 4 ? "Categoria Diamante: trilha completa. Agora é manter, revisar e desconfiar de promessa fácil."
    : `Categoria ${TIERS[tier]}. Faltam ${Math.max(1, (tier + 1) * 25 - pct)}% para ${next}.`;
  const stops = [1,2,3,4].map(i => `<span class="stop${tier >= i ? " on" : ""}" style="left:calc(12px + (100% - 24px) * ${i / 4})"></span>`).join("");
  // rótulos: o primeiro alinha à esquerda, o último à direita, os do meio centralizados na parada
  const pos = i => i === 0 ? "left:0;transform:none" : i === 4 ? "right:0;transform:none" : `left:calc(12px + (100% - 24px) * ${i / 4})`;
  const lbls = [0,1,2,3,4].map(i => `<span class="lbl${tier === i ? " on" : ""}" style="${pos(i)}">${TIERS[i]}</span>`).join("");
  return `
  <section class="card2 pad18 stack" aria-labelledby="hRota">
    <div class="row"><h2 class="h13" id="hRota">Sua rota</h2><span class="num">${pct}%</span></div>
    <div class="route" style="--p:${p}" role="img" aria-label="${pct}% da trilha, categoria ${TIERS[tier]}">
      <span class="track"></span><span class="fill"></span>${stops}<span class="plane">${PLANE}</span>${lbls}
    </div>
    <p class="now">${msg}</p>
    <div class="cells">
      <div class="cell"><b class="num">${c[1]}</b><span>Assisti</span></div>
      <div class="cell"><b class="num">${c[2]}</b><span>Pratiquei</span></div>
      <div class="cell"><b class="num">${c[3]}</b><span>Apliquei</span></div>
    </div>
  </section>`;
}

// valores de exemplo; o aluno troca pelos dele. Tudo é calculado no aparelho.
const CALCS = [
  { nome: "Usar milhas?", titulo: "Vale usar milhas nesta passagem?",
    intro: "Compare o preço em dinheiro com o que a companhia pede em milhas. O resultado é quanto cada mil milhas está valendo neste resgate.",
    campos: [
      ["preco", "Preço da passagem em dinheiro", "R$", 1500, "O mesmo voo, mesma tarifa e bagagem, pago no cartão."],
      ["milhas", "Milhas pedidas no resgate", "milhas", 30000, ""],
      ["taxas", "Taxas pagas em dinheiro no resgate", "R$", 80, "Taxa de embarque e outras cobranças da emissão."],
      ["cpm", "Quanto custou o seu milheiro (CPM)", "R$", 17.5, "Se as milhas vieram do cartão, use quanto custaria repor essas milhas numa boa transferência bonificada."]
    ],
    calc: v => {
      const mil = v.milhas / 1000;
      if (!(mil > 0)) return null;
      const vm = (v.preco - v.taxas) / mil;
      const custo = mil * v.cpm + v.taxas;
      const eco = v.preco - custo;
      const ok = vm > v.cpm * 1.15, mid = vm > v.cpm;
      return { big: brl(vm) + " por milheiro",
        verdict: [ok ? "ok" : mid ? "mid" : "bad", ok ? "Bom resgate: as milhas estão valendo mais do que custaram." : mid ? "Resgate no limite: ganha pouco em relação ao dinheiro." : "Melhor pagar em dinheiro e guardar as milhas."],
        linhas: [`Usando milhas, a passagem custa de verdade <b>${brl(custo)}</b> (milhas pelo seu CPM + taxas).`,
          `${eco >= 0 ? "Economia" : "Prejuízo"} contra pagar em dinheiro: <b>${brl(Math.abs(eco))}</b>.`],
        formula: "Valor do milheiro = (preço em dinheiro − taxas) ÷ (milhas ÷ 1.000). Margem de 15% para compensar o risco de cancelamento e as regras de remarcação." };
    } },
  { nome: "Custo (CPM)", titulo: "Quanto custou cada mil milhas?",
    intro: "Para compra de pontos, compra bonificada ou clube: some o que pagou e veja o custo final depois da transferência com bônus.",
    campos: [
      ["pago", "Total pago pelos pontos", "R$", 1400, "Preço da compra ou mensalidades do clube somadas."],
      ["pontos", "Pontos recebidos no banco/programa", "pontos", 40000, ""],
      ["paridade", "Paridade da transferência", "milhas por ponto", 1, "Ex.: 1 ponto vira 1 milha → 1. Confira no regulamento."],
      ["bonus", "Bônus da transferência", "%", 80, "Promoção vigente. Sem promoção, 0."]
    ],
    calc: v => {
      const milhas = v.pontos * v.paridade * (1 + v.bonus / 100);
      if (!(milhas > 0)) return null;
      const cpm = v.pago / (milhas / 1000);
      return { big: brl(cpm) + " por milheiro",
        verdict: [cpm <= 17 ? "ok" : cpm <= 25 ? "mid" : "bad", cpm <= 17 ? "Custo baixo para o mercado." : cpm <= 25 ? "Custo intermediário: só compensa com um resgate já em vista." : "Custo alto: dificilmente compensa contra pagar em dinheiro."],
        linhas: [`Você fica com <b>${fmt(Math.round(milhas))} milhas</b>.`,
          "Faixas de referência são aproximadas e mudam com o mercado. Compare sempre com o resgate que você pretende fazer, na aba Usar milhas?."],
        formula: "CPM = total pago ÷ (pontos × paridade × (1 + bônus) ÷ 1.000)." };
    } },
  { nome: "Cartão", titulo: "A anuidade do cartão se paga?",
    intro: "Quanto o cartão devolve em pontos por ano, já descontada a anuidade. Muitas vezes a resposta é não, e tudo bem trocar de cartão.",
    campos: [
      ["gasto", "Gasto médio por mês no cartão", "R$", 5000, "Só o que você já gasta. Não aumente gastos para pontuar."],
      ["ppd", "Pontos por dólar", "pts/US$", 2, "Está no contrato do cartão. Pode mudar por faixa de gasto."],
      ["dolar", "Cotação do dólar usada pelo banco", "R$", 5.5, "O banco converte o gasto em reais para dólar só para calcular pontos."],
      ["anuidade", "Anuidade por ano (o que você paga de fato)", "R$", 1200, "Se tem isenção garantida, coloque 0."],
      ["vm", "Quanto vale um milheiro para você", "R$", 18, "Use quanto custaria repor essas milhas numa boa promoção, não o do melhor resgate da vida."]
    ],
    calc: v => {
      if (!(v.dolar > 0)) return null;
      const pts = v.gasto * 12 / v.dolar * v.ppd;
      const bruto = pts / 1000 * v.vm, liq = bruto - v.anuidade;
      return { big: (liq >= 0 ? "+" : "−") + brl(Math.abs(liq)) + " por ano",
        verdict: [liq > 0 ? "ok" : "bad", liq > 0 ? "O cartão se paga, nas suas premissas." : "A anuidade come os pontos. Negocie, peça isenção ou procure outro cartão."],
        linhas: [`Pontos por ano: <b>${fmt(Math.round(pts))}</b>, que valem cerca de <b>${brl(bruto)}</b>.`,
          "Não conta benefícios como salas VIP e seguros: some só os que você usaria de verdade."],
        formula: "Pontos/ano = gasto mensal × 12 ÷ dólar × pontos por dólar. Retorno = pontos ÷ 1.000 × valor do milheiro − anuidade." };
    } }
];
const brl = n => "R$ " + (Math.round(n * 100) / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = n => n.toLocaleString("pt-BR");
const calcVals = CALCS.map(c => Object.fromEntries(c.campos.map(f => [f[0], f[3]])));

const NAV_OF = { aula: "trilha", guia: "trilha", sobre: "inicio" };
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const [v, arg] = h.split("/");
  let view = "inicio", scrollTo = null;
  if (v === "aula" && TECH_BY_ID[arg]) view = "aula", setTech(arg);
  else if (v === "trilha") {
    view = "trilha";
    const n = +arg;
    if (n && modTitle(n)) { ui.etapa = n; scrollTo = "etapa-" + n; }
  }
  else if (v === "glossario") view = "glossario";
  else if (v.startsWith("g-")) { view = "glossario"; const g = GLOSS.find(x => x.id === v); if (g) { ui.busca = g.termo; ui.cat = ""; } }
  else if (v === "calculadora") { view = "calculadora"; if (CALCS[+arg]) ui.calc = +arg; }
  else if (v === "sobre" && SITE.sobre) view = "sobre";
  else if (v === "guia" && GUIAS[arg] && SITE[arg] && SITE[arg].length) { view = "guia"; ui.guia = arg; }
  ui.view = view;
  closeSheet();
  render();
  const el = scrollTo && document.getElementById(scrollTo);
  if (el) el.scrollIntoView({ block: "start" }); else window.scrollTo(0, 0);
}
function setTech(id){

/* ---------- render ---------- */
// troca o conteúdo da tela, mas deixa no lugar o bloco marcado com data-keep (os vídeos):
// tirar um iframe do DOM recarrega o player, e marcar o nível não pode parar o vídeo
function patch(app, html){
  const tpl = document.createElement("template"); tpl.innerHTML = html;
  const fresh = [...tpl.content.children].find(el => el.dataset.keep);
  const kept = fresh && [...app.children].find(el => el.dataset.keep === fresh.dataset.keep);
  if (!kept) { stopVideo(); app.replaceChildren(tpl.content); return; }
  [...app.childNodes].forEach(n => { if (n !== kept) n.remove(); });
  const nodes = [...tpl.content.childNodes], i = nodes.indexOf(fresh);
  kept.before(...nodes.slice(0, i));
  kept.after(...nodes.slice(i + 1));
}
function render(){
  const app = $("#app");
  const k = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
  patch(app, VIEWS[ui.view]());
  const nav = NAV_OF[ui.view] || ui.view;
  document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  if (ui.view === "glossario") renderGloss();
  if (ui.view === "calculadora") renderCalc();
  if (ui.view === "aula") {
    const why = $("#why"), more = $("#lerMais");
    more.hidden = !ui.lerMais && why.scrollHeight <= why.clientHeight + 1;
  }
  if (k) { const el = app.querySelector(`[data-k="${k}"]`); if (el) el.focus({ preventScroll: true }); }
}

  closeSheet();
  sheetFrom = btn;
  const back = document.createElement("div"); back.className = "sheet-back"; back.dataset.close = "1";
  const sh = document.createElement("div"); sh.className = "sheet";
  sh.setAttribute("role", "dialog"); sh.setAttribute("aria-modal", "true"); sh.setAttribute("aria-labelledby", "sheetT"); sh.tabIndex = -1;
  sh.innerHTML = `
    <div class="row"><b id="sheetT">${esc(g.termo)}</b><small>${esc(g.categoria || "")}${g.avancado ? " · Avançado" : ""}</small></div>
    <p>${esc(g.definicao)}</p>
    <div class="acts"><button type="button" class="pill" data-veja="${GLOSS.indexOf(g)}">Ver no glossário →</button><button type="button" class="pill" data-close="1">Fechar</button></div>`;
  document.body.append(back, sh);
  sh.focus();
}
function closeSheet(){
  document.querySelectorAll(".sheet, .sheet-back").forEach(el => el.remove());
  if (sheetFrom && document.contains(sheetFrom)) sheetFrom.focus({ preventScroll: true });
  sheetFrom = null;
}
addEventListener("keydown", e => {
  if (e.key === "Escape" && $(".sheet")) { closeSheet(); return; }
  // termo sublinhado é um span (não quebra a pontuação para a linha de baixo); Enter e espaço abrem
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("gl")) { e.preventDefault(); openSheet(e.target); return; }
  // setas trocam de aba
  const tab = e.target.closest && e.target.closest("[data-aba],[data-calc]");
  if (tab && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    const isCalc = "calc" in tab.dataset, n = isCalc ? CALCS.length : 3, d = e.key === "ArrowRight" ? 1 : n - 1;
    if (isCalc) ui.calc = (ui.calc + d) % n; else ui.aba = (ui.aba + d) % n;
    render(); const el = $(isCalc ? `[data-calc="${ui.calc}"]` : `[data-aba="${ui.aba}"]`); if (el) el.focus();
  }
});

/* ---------- toast ---------- */
let toastT;
function toast(html){
  const el = $("#toast"); el.innerHTML = html; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 3200);
}

/* ---------- persistência ---------- */
let remote = null;
let saveT, saving = false, dirty = false;
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
function scheduleRemote(){
  if (!remote) return;
  dirty = true; clearTimeout(saveT); saveT = setTimeout(flushRemote, 900);
}
async function flushRemote(){
  if (!remote || saving || !dirty) return;
  saving = true; dirty = false;
  try { await remote.set({ levels: { ...state }, updatedAt: new Date().toISOString() }); }
  catch (e) { if (e && e.code === "unavailable") dirty = true; else if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { remote = null; setSync(false); } }
  saving = false;
  if (dirty) { clearTimeout(saveT); saveT = setTimeout(flushRemote, 1500); }
}
function setSync(on){
  ui.sync = on;
  const el = $("#syncLbl"); if (el) el.textContent = on ? "Salvo na sua conta" : "Salvo neste aparelho";
}
async function connect(){
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    remote = db.doc("data/users/" + uid + "/progress");
    const snap = await remote.get();
    const valid = Object.fromEntries(TECHS.map(t => [t.id, true]));
    if (snap.exists) {
      const lvs = (snap.data() || {}).levels || {};
      const merged = {};
      for (const k in lvs) if (valid[k]) merged[k] = Math.max(0, Math.min(3, +lvs[k] || 0));
      for (const k in state) if (valid[k]) merged[k] = Math.max(merged[k]||0, state[k]||0);
      const changed = JSON.stringify(merged) !== JSON.stringify(lvs);
      state = merged; saveLocal(); render();
      if (changed) scheduleRemote();
    } else if (Object.keys(state).length) {
      scheduleRemote();
    }
    setSync(true);
  } catch (e) { remote = null; setSync(false); }
}

/* ---------- marcar nível ---------- */
function setLevel(id, l){
  const t = TECH_BY_ID[id]; if (!t) return;
  const before = totals().tier, modBefore = modStats(t.modulo).frac;
  const cur = state[id] || 0;
  const next = cur === l ? l - 1 : l;          // tocar no nível atual desmarca um passo
  if (next <= 0) delete state[id]; else state[id] = next;
  saveLocal(); scheduleRemote();
  const tier = totals().tier, modNow = modStats(t.modulo).frac;
  if (tier > before) toast(tier === 4 ? "Trilha completa! Categoria <b>Diamante</b>." : `Você subiu para a categoria <b>${TIERS[tier]}</b>!`);
  else if (modBefore < 1 && modNow === 1) toast(`Etapa ${t.modulo} fechada: <b>${esc(modTitle(t.modulo))}</b>`);
  else toast(`${esc(t.nome)}: <b>${next ? LEVELS[next] : "desmarcada"}</b>`);
  render();
}

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const gl = e.target.closest("[data-g]");
  if (gl) { e.preventDefault(); openSheet(gl); return; }
  if (e.target.closest("[data-close]")) { closeSheet(); return; }
  const veja = e.target.closest("[data-veja]");
  if (veja) {
    const g = GLOSS[+veja.dataset.veja]; ui.busca = g.termo; ui.cat = "";
    sheetFrom = null; closeSheet();
    if (location.hash === "#glossario") route(); else location.hash = "#glossario";
    return;
  }
  const pv = e.target.closest("[data-play]") || (e.target.closest(".video .vt b") && e.target.closest(".video").querySelector("[data-play]"));
  if (pv) { play(pv); return; }
  const b = e.target.closest("[data-lv]");
  if (b) { setLevel(b.dataset.id, +b.dataset.lv); return; }
  const st = e.target.closest("[data-stage]");
  if (st) {
    const n = +st.dataset.stage;
    ui.etapa = openStage() === n ? null : n;      // abrir uma etapa fecha a anterior
    history.replaceState(null, "", ui.etapa ? "#trilha/" + ui.etapa : "#trilha");
    render();
    const sec = document.getElementById("etapa-" + n);
    if (sec && sec.getBoundingClientRect().top < 0) sec.scrollIntoView({ block: "start" });
    return;
  }
  const f = e.target.closest("[data-filtro]");
  if (f) { ui.filtro = +f.dataset.filtro; render(); return; }
  const a = e.target.closest("[data-aba]");
  if (a) { ui.aba = +a.dataset.aba; render(); return; }
  const cb = e.target.closest("[data-calc]");
  if (cb) { ui.calc = +cb.dataset.calc; history.replaceState(null, "", "#calculadora/" + ui.calc); render(); return; }
  const c = e.target.closest("[data-cat]");
  if (c) {
    ui.cat = c.dataset.cat;
    document.querySelectorAll("[data-cat]").forEach(x => x.setAttribute("aria-pressed", x === c ? "true" : "false"));
    renderGloss(); return;
  }
  if (e.target.closest("#lerMais")) { ui.lerMais = !ui.lerMais; render(); return; }
  const r = e.target.closest("[data-reset]");
  if (r) {
    const act = r.dataset.reset;
    if (act === "yes") { state = {}; saveLocal(); scheduleRemote(); ui.etapa = undefined; render(); toast("Progresso zerado."); return; }
    $("#resetBox").innerHTML = resetHTML(act === "ask");
    const el = $(act === "ask" ? '[data-reset="no"]' : '[data-reset="ask"]'); if (el) el.focus();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "glSearch") { ui.busca = e.target.value; renderGloss(); }
  if (e.target.dataset && e.target.dataset.f) { calcVals[ui.calc][e.target.dataset.f] = parseNum(e.target.value); renderCalc(); }
});
addEventListener("hashchange", route);

/* ---------- boot ---------- */
route();
connect();
</script>
</body>
</html>
